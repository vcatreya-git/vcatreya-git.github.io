<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">

<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/></marker>
  <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4338CA"/></marker>
  <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#047857"/></marker>
</defs>

<style>
  .box    { fill:#EEF2FF; stroke:#4338CA; stroke-width:1.5; }
  .box-g  { fill:#ECFDF5; stroke:#047857; stroke-width:1.5; }
  .box-o  { fill:#FFF7ED; stroke:#C2410C; stroke-width:1.5; }
  .box-p  { fill:#F5F3FF; stroke:#6D28D9; stroke-width:1.5; }
  .box-c  { fill:#ECFEFF; stroke:#0891B2; stroke-width:1.5; }
  .box-y  { fill:#FFFBEB; stroke:#D97706; stroke-width:1.5; }
  .box-gray { fill:#F8FAFC; stroke:#64748B; stroke-width:1.5; }
  .box-w  { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.5; }
  .box-core { fill:#3949FF; stroke:#2733D6; stroke-width:1.5; }
  .title  { font:700 18px system-ui,sans-serif; fill:#0F172A; }
  .sub    { font:12px system-ui,sans-serif; fill:#64748B; }
  .lab    { font:600 12px system-ui,sans-serif; fill:#1E293B; text-anchor:middle; }
  .lab-w  { font:600 12px system-ui,sans-serif; fill:#FFFFFF; text-anchor:middle; }
  .lab2   { font:11px system-ui,sans-serif; fill:#64748B; text-anchor:middle; }
  .lab2-w { font:11px system-ui,sans-serif; fill:#C7D2FE; text-anchor:middle; }
  .lab-l  { font:600 12px system-ui,sans-serif; fill:#1E293B; }
  .lab2-l { font:11px system-ui,sans-serif; fill:#64748B; }
  .edge   { stroke:#94A3B8; stroke-width:1.5; fill:none; marker-end:url(#arr); }
  .edge-b { stroke:#4338CA; stroke-width:1.6; fill:none; marker-end:url(#arrb); }
  .edge-g { stroke:#047857; stroke-width:1.5; fill:none; marker-end:url(#arrg); }
  .legend { font:11px system-ui,sans-serif; fill:#94A3B8; }
  .group  { fill:none; stroke:#CBD5E1; stroke-width:1.2; stroke-dasharray:4 3; }
  .group-lab { font:700 10px system-ui,sans-serif; fill:#94A3B8; letter-spacing:0.6px; }
</style>


<text x="40" y="36" class="title">Predictopia v2 — Scoring &amp; settlement tracking</text>
<text x="40" y="56" class="sub">Autopilot outcomes · manual specials · period close freezes standings · Splitwise-style owed/settled</text>

<!-- left: scoring -->
<rect x="30" y="90" width="440" height="360" rx="12" class="group"/>
<text x="45" y="112" class="group-lab">SCORING</text>

<rect x="50" y="130" width="180" height="50" rx="8" class="box-o"/>
  <text x="140" y="152" class="lab">sync-results job</text>
  <text x="140" y="168" class="lab2">provider → match.outcome</text>
<rect x="260" y="130" width="180" height="50" rx="8" class="box-y"/>
  <text x="350" y="152" class="lab">Admin resolve special</text>
  <text x="350" y="168" class="lab2">correct_answer[]</text>

<rect x="140" y="220" width="220" height="60" rx="10" class="box-core"/>
  <text x="250" y="245" class="lab-w">app.score_event()</text>
  <text x="250" y="263" class="lab2-w">one function · both kinds</text>

<rect x="50" y="320" width="180" height="50" rx="8" class="box-g"/>
  <text x="140" y="342" class="lab">event_scores rows</text>
  <text x="140" y="358" class="lab2">points · partial · exact</text>
<rect x="260" y="320" width="180" height="50" rx="8" class="box"/>
  <text x="350" y="342" class="lab">Board / Me</text>
  <text x="350" y="358" class="lab2">SUM + period filter</text>

<path d="M140,180 V220" class="edge"/>
<path d="M350,180 V220" class="edge"/>
<path d="M250,280 V320" class="edge-b"/>
<path d="M230,345 H260" class="edge"/>

<!-- right: money -->
<rect x="500" y="90" width="450" height="360" rx="12" class="group"/>
<text x="515" y="112" class="group-lab">SETTLEMENT (NO PAYMENTS)</text>

<rect x="520" y="130" width="190" height="50" rx="8" class="box"/>
  <text x="615" y="152" class="lab">Close period (Money)</text>
  <text x="615" y="168" class="lab2">snapshot standings</text>
<rect x="740" y="130" width="190" height="50" rx="8" class="box-y"/>
  <text x="835" y="152" class="lab">Special resolve</text>
  <text x="835" y="168" class="lab2">exact winners only</text>

<rect x="600" y="220" width="240" height="55" rx="10" class="box-p"/>
  <text x="720" y="245" class="lab">app.apply_split()</text>
  <text x="720" y="262" class="lab2">split · shrink (budget-safe)</text>

<rect x="520" y="310" width="190" height="50" rx="8" class="box-g"/>
  <text x="615" y="332" class="lab">payouts rows</text>
  <text x="615" y="348" class="lab2">owed | settled</text>
<rect x="740" y="310" width="190" height="50" rx="8" class="box-gray"/>
  <text x="835" y="332" class="lab">buy_in_collected</text>
  <text x="835" y="348" class="lab2">separate flag</text>

<rect x="560" y="390" width="320" height="40" rx="8" class="box-w"/>
  <text x="720" y="415" class="lab">Money tab + /api/me/money rollup</text>

<path d="M615,180 V220" class="edge"/>
<path d="M835,180 V220" class="edge"/>
<path d="M720,275 V310" class="edge-g"/>
<path d="M615,360 V390" class="edge"/>

<text x="40" y="490" class="legend">Labels: Collected/Not collected (buy-in) · Owed/Settled (prizes). Closed period snapshots immutable. Result correction re-scores points; does not rewrite closed pots.</text>

</svg>
