<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">

<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/></marker>
  <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4338CA"/></marker>
  <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#047857"/></marker>
</defs>

<style>
  .box    { fill:#EEF2FF; stroke:#4338CA; stroke-width:1.5; }
  .box-g  { fill:#ECFDF5; stroke:#047857; stroke-width:1.5; }
  .box-o  { fill:#FFF7ED; stroke:#C2410C; stroke-width:1.5; }
  .box-p  { fill:#F5F3FF; stroke:#6D28D9; stroke-width:1.5; }
  .box-c  { fill:#ECFEFF; stroke:#0891B2; stroke-width:1.5; }
  .box-y  { fill:#FFFBEB; stroke:#D97706; stroke-width:1.5; }
  .box-gray { fill:#F8FAFC; stroke:#64748B; stroke-width:1.5; }
  .box-w  { fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.5; }
  .box-core { fill:#3949FF; stroke:#2733D6; stroke-width:1.5; }
  .title  { font:700 18px system-ui,sans-serif; fill:#0F172A; }
  .sub    { font:12px system-ui,sans-serif; fill:#64748B; }
  .lab    { font:600 12px system-ui,sans-serif; fill:#1E293B; text-anchor:middle; }
  .lab-w  { font:600 12px system-ui,sans-serif; fill:#FFFFFF; text-anchor:middle; }
  .lab2   { font:11px system-ui,sans-serif; fill:#64748B; text-anchor:middle; }
  .lab2-w { font:11px system-ui,sans-serif; fill:#C7D2FE; text-anchor:middle; }
  .lab-l  { font:600 12px system-ui,sans-serif; fill:#1E293B; }
  .lab2-l { font:11px system-ui,sans-serif; fill:#64748B; }
  .edge   { stroke:#94A3B8; stroke-width:1.5; fill:none; marker-end:url(#arr); }
  .edge-b { stroke:#4338CA; stroke-width:1.6; fill:none; marker-end:url(#arrb); }
  .edge-g { stroke:#047857; stroke-width:1.5; fill:none; marker-end:url(#arrg); }
  .legend { font:11px system-ui,sans-serif; fill:#94A3B8; }
  .group  { fill:none; stroke:#CBD5E1; stroke-width:1.2; stroke-dasharray:4 3; }
  .group-lab { font:700 10px system-ui,sans-serif; fill:#94A3B8; letter-spacing:0.6px; }
</style>


<text x="40" y="36" class="title">Predictopia v2 — Deployment (free tier)</text>
<text x="40" y="56" class="sub">$0/mo at family scale · portable off Vercel/Supabase later via plain Postgres + adapters</text>

<!-- Client -->
<rect x="40" y="100" width="200" height="360" rx="12" class="group"/>
<text x="55" y="122" class="group-lab">CLIENT</text>
<rect x="60" y="140" width="160" height="70" rx="10" class="box"/>
  <text x="140" y="168" class="lab">Installable PWA</text>
  <text x="140" y="186" class="lab2">service worker · Web Push</text>
<rect x="60" y="230" width="160" height="70" rx="10" class="box-gray"/>
  <text x="140" y="258" class="lab">Browser</text>
  <text x="140" y="276" class="lab2">mobile-first UI</text>
<rect x="60" y="320" width="160" height="70" rx="10" class="box-c"/>
  <text x="140" y="348" class="lab">Local timezone</text>
  <text x="140" y="366" class="lab2">UTC store · viewer display</text>

<!-- Vercel -->
<rect x="280" y="100" width="220" height="360" rx="12" class="group"/>
<text x="295" y="122" class="group-lab">VERCEL (HOBBY)</text>
<rect x="300" y="140" width="180" height="80" rx="10" class="box-core"/>
  <text x="390" y="170" class="lab-w">Next.js App Router</text>
  <text x="390" y="188" class="lab2-w">UI + Route Handlers</text>
  <text x="390" y="204" class="lab2-w">/api/*  /api/jobs/*</text>
<rect x="300" y="240" width="180" height="60" rx="10" class="box-p"/>
  <text x="390" y="265" class="lab">Auth.js v5</text>
  <text x="390" y="282" class="lab2">Google OAuth only</text>
<rect x="300" y="320" width="180" height="60" rx="10" class="box-y"/>
  <text x="390" y="345" class="lab">Job routes</text>
  <text x="390" y="362" class="lab2">Bearer JOB_SECRET</text>
<rect x="300" y="400" width="180" height="40" rx="10" class="box-w"/>
  <text x="390" y="425" class="lab">Env secrets only</text>

<!-- Supabase -->
<rect x="540" y="100" width="200" height="220" rx="12" class="group"/>
<text x="555" y="122" class="group-lab">SUPABASE FREE</text>
<rect x="560" y="140" width="160" height="70" rx="10" class="box-g"/>
  <text x="640" y="168" class="lab">Postgres 15</text>
  <text x="640" y="186" class="lab2">RLS · GUCs · triggers</text>
<rect x="560" y="230" width="160" height="60" rx="10" class="box-g"/>
  <text x="640" y="255" class="lab">Storage</text>
  <text x="640" y="272" class="lab2">avatars · icons</text>

<!-- External jobs -->
<rect x="780" y="100" width="170" height="360" rx="12" class="group"/>
<text x="795" y="122" class="group-lab">EXTERNAL</text>
<rect x="795" y="140" width="140" height="55" rx="10" class="box-y"/>
  <text x="865" y="163" class="lab">GH Actions</text>
  <text x="865" y="180" class="lab2">15-min crons</text>
<rect x="795" y="215" width="140" height="55" rx="10" class="box-o"/>
  <text x="865" y="238" class="lab">Sports APIs</text>
  <text x="865" y="255" class="lab2">adapter seam</text>
<rect x="795" y="290" width="140" height="55" rx="10" class="box-c"/>
  <text x="865" y="313" class="lab">Resend</text>
  <text x="865" y="330" class="lab2">email fallback</text>
<rect x="795" y="365" width="140" height="55" rx="10" class="box-p"/>
  <text x="865" y="388" class="lab">Google</text>
  <text x="865" y="405" class="lab2">OAuth only</text>

<path d="M220,265 H280" class="edge-b"/>
<path d="M480,200 H540" class="edge-b"/>
<path d="M480,350 H640 V320" class="edge"/>
<path d="M865,195 V140 H480" class="edge"/>
<path d="M795,242 H740 V280 H500" class="edge"/>

<text x="40" y="490" class="legend">No Vercel Cron for reminders (Hobby = daily only). No Supabase Realtime. No auth.uid() — portable GUC identity.</text>

</svg>
