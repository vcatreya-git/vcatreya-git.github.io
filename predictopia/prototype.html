<!-- Clean public build of prototype-v3-claude.html (2026-08-06) — same app,
     same mock data, same interactivity. Strips the internal documentation
     rail + per-screen story notes so this can stand alone as a portfolio
     demo. Keep this in sync with prototype-v3-claude.html's V/state/data —
     do not fork the product logic, only the outer chrome differs. -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predictopia — Interactive Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

:root,[data-theme="light"]{
  --bg:#f7f8fb; --bg2:#eef1f7; --panel:#fff; --panel2:#f4f6fa; --line:#e2e6ef;
  --text:#141821; --muted:#565e70; --dim:#8b93a5;
  --accent:#3949ff; --accent-rgb:57,73,255; --accent-dim:rgba(57,73,255,.08);
  --on-accent:#fff;
  --coral:#e8492f; --sky:#0284c7; --ok:#0e9f6e; --ok-dim:rgba(14,159,110,.1);
  --warn:#b45309; --warn-dim:rgba(180,83,9,.1); --danger:#dc2626; --danger-dim:rgba(220,38,38,.08);
  --font:'Inter',system-ui,sans-serif; --display:'Sora',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --hero:url('assets/hero-light.jpg');
  --device-bg:#fff;
  --device-shadow:0 40px 80px -20px rgba(20,24,33,.28), 0 0 0 1px rgba(20,24,33,.05);
  --radius:20px;
  --glow1:rgba(57,73,255,.05); --glow2:rgba(14,159,110,.05);
  --img-blend:normal; --hero-op:.5;
}
[data-theme="dark"]{
  --bg:#0b0e09; --bg2:#131810; --panel:#181f14; --panel2:#1f281a; --line:#2b3626;
  --text:#f0f4e8; --muted:#a3b099; --dim:#78846d;
  --accent:#c8f542; --accent-rgb:200,245,66; --accent-dim:rgba(200,245,66,.13);
  --on-accent:#11170d;
  --coral:#ff8064; --sky:#7dd3fc; --ok:#4ade80; --ok-dim:rgba(74,222,128,.13);
  --warn:#fbbf24; --warn-dim:rgba(251,191,36,.13); --danger:#f87171; --danger-dim:rgba(248,113,113,.12);
  --font:'Inter',system-ui,sans-serif; --display:'Sora',system-ui,sans-serif;
  --hero:url('assets/hero-dark.jpg');
  --device-bg:linear-gradient(180deg,#1b2318 0%,#10150e 100%);
  --device-shadow:0 40px 90px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(200,245,66,.07);
  --glow1:rgba(200,245,66,.07); --glow2:rgba(255,128,100,.05);
  --hero-op:.85;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--font);font-size:15px;color:var(--text);
  background:radial-gradient(1000px 500px at 8% -10%,var(--glow1),transparent 55%),
             radial-gradient(800px 450px at 100% 0%,var(--glow2),transparent 50%),var(--bg);
  padding:26px 16px 60px;transition:background-color .25s,color .25s;
}
::selection{background:var(--accent);color:var(--on-accent);}

.stage{max-width:1180px;margin:0 auto;}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin-bottom:22px;max-width:412px;margin-left:auto;margin-right:auto;}
.brand-row{display:flex;align-items:center;gap:10px;}
.brand-block .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.right-controls{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.theme-toggle{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
.theme-toggle button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:6px;min-height:36px;font-family:var(--font);transition:.15s;}
.theme-toggle button.on{background:var(--accent);color:var(--on-accent);}

.layout{display:flex;justify-content:center;}

.device-wrap{display:flex;justify-content:center;}
.device{width:100%;max-width:412px;background:var(--device-bg);border-radius:44px;box-shadow:var(--device-shadow);
  overflow:hidden;height:840px;display:flex;flex-direction:column;position:relative;}
.statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;
  font-size:12.5px;font-weight:700;color:var(--text);background:var(--panel);flex-shrink:0;}
.statusbar .sb-r{display:flex;align-items:center;gap:5px;}
.device-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 17px 20px;background:var(--bg);scroll-behavior:smooth;}
.device-body::-webkit-scrollbar{width:0;}
.screen-in{animation:sIn .28s cubic-bezier(.22,1,.36,1);}
@keyframes sIn{from{opacity:0;transform:translateY(8px);}}

.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel);padding:9px 6px 15px;flex-shrink:0;}
.tabbar button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:10.5px;font-weight:700;padding:7px 4px;
  min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-family:var(--font);transition:.15s;}
.tabbar button.on{color:var(--accent);background:var(--accent-dim);}
.tabbar button .badge{position:absolute;transform:translate(11px,-9px);background:var(--coral);color:#fff;font-size:9px;
  font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* atoms */
.kicker{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.display{font-family:var(--display);font-size:25px;line-height:1.12;letter-spacing:-.015em;margin-bottom:7px;}
.sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:15px;}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;position:relative;overflow:hidden;}
.card.glow{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}

/* Shareable card — a screenshot-worthy preview, not just a text export.
   Branded so a shared screenshot still carries the product name (2026-08-02). */
.share-preview{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-top:10px;}
.share-brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:14px;font-weight:800;}
.card.dashed{border-style:dashed;background:var(--panel2);}
.card.tap{cursor:pointer;transition:transform .14s cubic-bezier(.22,1,.36,1),border-color .14s,box-shadow .14s;}
.card.tap:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 26px -12px rgba(var(--accent-rgb),.5);}
.card.tap:active{transform:scale(.985);}
.card.flag{background:var(--warn-dim);border-color:rgba(180,83,9,.35);}

.pool-cover{height:76px;margin:-15px -15px 13px;background-size:cover;background-position:center;position:relative;}
.pool-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),var(--panel) 96%);}
.pool-cover .cov-chips{position:absolute;left:13px;top:12px;display:flex;gap:6px;z-index:2;}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;}
.chip-accent{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.25);}
.chip-coral{background:rgba(232,73,47,.12);color:var(--coral);border:1px solid rgba(232,73,47,.28);}
.chip-sky{background:rgba(2,132,199,.12);color:var(--sky);border:1px solid rgba(2,132,199,.28);}
.chip-ok{background:var(--ok-dim);color:var(--ok);border:1px solid rgba(14,159,110,.28);}
.chip-muted{background:var(--panel2);color:var(--muted);border:1px solid var(--line);}
.chip-warn{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(180,83,9,.3);}
.chip-solid{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);}
.live-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:14.5px;font-weight:700;cursor:pointer;min-height:52px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font);transition:.14s;}
.btn-accent{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px -8px rgba(var(--accent-rgb),.9);}
.btn-accent:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn-accent:active{transform:translateY(0);}
.btn-ghost{background:var(--panel);color:var(--text);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-sm{width:auto;min-height:42px;padding:9px 14px;font-size:12.5px;border-radius:11px;}

img.av{border-radius:12px;object-fit:cover;flex-shrink:0;display:block;}
img.av.lg{width:46px;height:46px;border-radius:14px;}
img.av.md{width:38px;height:38px;}
img.av.sm{width:30px;height:30px;border-radius:9px;}
.av-stack{display:flex;}
.av-stack img{margin-left:-9px;border:2px solid var(--panel);}
.av-stack img:first-child{margin-left:0;}

.back{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer;
  padding:6px 0 11px;min-height:42px;font-family:var(--font);display:flex;align-items:center;gap:5px;}

/* match card */
.match-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--panel);position:relative;}
.match-hero{height:36px;background-size:cover;background-position:center;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 12px;}
.match-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.3));}
.match-hero>*{position:relative;z-index:1;}
.match-meta{font-family:var(--mono);font-size:10px;font-weight:700;color:rgba(255,255,255,.92);letter-spacing:.03em;}
.match-body{padding:10px 12px;}

/* Shrunk (2026-08-06) — was min-height:112px, occupying too much of the
   screen with 5 pending matches stacked (poolPredict/poolFootball/
   predictHub all share this component). ~30% shorter, crest/text scaled
   down to match, still comfortably above the 48px tap-target minimum. */
.pick-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:stretch;}
.pick-grid.three{grid-template-columns:1fr .8fr 1fr;}
/* Dropped the resting-state panel2 fill (2026-08-06) — a grey box behind
   every crest read as clunky, doubling up on the match-card's own white
   background. Border alone still gives the tap target definition; the
   accent-tinted background on .pick.on is kept, since that one's doing
   real work (the clearest signal for "this is your pick"). */
.pick{border:2px solid var(--line);border-radius:14px;padding:9px 6px 8px;text-align:center;cursor:pointer;
  min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.16s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;}
.pick img{width:32px;height:32px;object-fit:contain;transition:transform .2s;}
.pick .code{font-family:var(--display);font-size:13.5px;letter-spacing:-.01em;line-height:1;}
.pick .name{font-size:10.5px;color:var(--dim);font-weight:600;}
.pick:hover{border-color:rgba(var(--accent-rgb),.45);transform:translateY(-2px);}
.pick:hover img{transform:scale(1.07);}
.pick.on{border-color:var(--accent);background:var(--accent-dim);}
.pick.on::after{content:"✓";position:absolute;top:5px;right:7px;font-size:10px;font-weight:800;color:var(--accent);}
.pick.dim{opacity:.4;filter:saturate(.4);}
.pick.dim img{filter:grayscale(.7);}
.pick.dim:hover{opacity:.75;}
.pick.draw{min-height:78px;}
.pick.draw .code{font-size:12px;}
.vs{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;color:var(--dim);}

/* sport-themed pick celebration */
.flash{position:absolute;inset:0;z-index:38;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;}
.flash.show{animation:flashPop .9s cubic-bezier(.22,1,.36,1) forwards;}
.flash .ftxt{font-family:var(--display);font-size:26px;letter-spacing:-.01em;color:#fff;padding:10px 22px;
  border-radius:16px;text-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;}
.flash.goal .ftxt{background:linear-gradient(135deg,#0ea968,#0284c7);}
.flash.wicket .ftxt{background:linear-gradient(135deg,#e8492f,#b45309);}
.flash.generic .ftxt{background:var(--accent);color:var(--on-accent);}
@keyframes flashPop{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.02)}}

/* admin special events */
.special-card{border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--accent-dim),transparent 65%);
  border:1px solid rgba(var(--accent-rgb),.3);margin-bottom:13px;}
.special-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);background:var(--panel);border:1px solid rgba(var(--accent-rgb),.3);
  padding:3px 9px;border-radius:999px;margin-bottom:9px;}
.period-opt{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 13px;cursor:pointer;
  margin-bottom:8px;transition:.13s;}
.period-opt.on{border-color:var(--accent);background:var(--accent-dim);}

/* multi-pool sync toggle */
.switch{position:relative;display:inline-block;width:42px;height:25px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer;}
.switch .slider::before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked+.slider{background:var(--accent);}
.switch input:checked+.slider::before{transform:translateX(17px);}
.sync-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;
  border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin:12px 0;}
.sync-row .sync-txt b{font-size:13px;}
.sync-row .sync-sub{font-size:11px;color:var(--dim);margin-top:1px;}
.pool-switch{flex:0 0 auto;padding:7px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel2);
  color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.13s;}
.pool-switch.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}

/* prize tracking — money moves offline, app only tracks it */
.prize-card{border-radius:16px;padding:14px 15px;background:linear-gradient(135deg,var(--ok-dim),transparent 65%);
  border:1px solid rgba(14,159,110,.3);margin-bottom:13px;}
.prize-stat{text-align:center;}
.prize-stat .v{font-family:var(--display);font-size:19px;color:var(--ok);}
.prize-stat .l{font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.paid-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
.paid-row:last-child{border-bottom:0;}
.paid-toggle{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;cursor:pointer;border:1.5px solid var(--line);}
.paid-toggle.paid{background:var(--ok-dim);color:var(--ok);border-color:rgba(14,159,110,.3);}
.paid-toggle.unpaid{background:var(--warn-dim);color:var(--warn);border-color:rgba(180,83,9,.3);}

/* countdown */
.cd-wrap{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;margin-top:12px;
  background:var(--warn-dim);border:1px solid rgba(180,83,9,.22);}
.cd-wrap.urgent{background:var(--danger-dim);border-color:rgba(220,38,38,.28);}
.cd-wrap.locked{background:var(--panel2);border-color:var(--line);}
.cd-warn{color:var(--warn);}.cd-urgent{color:var(--danger);}.cd-calm{color:var(--muted);}

.ticker{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:700;padding:11px;
  border-radius:12px;margin:12px 0;background:var(--danger-dim);color:var(--danger);border:1px solid rgba(220,38,38,.25);}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:3px;margin-bottom:13px;}
.seg button{border:0;background:transparent;color:var(--dim);border-radius:11px;padding:10px 6px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:var(--font);min-height:40px;transition:.14s;}
.seg button.on{background:var(--accent);color:var(--on-accent);}

/* Custom dropdown — a native <select>'s popup is OS chrome and ignores the
   phone-mockup frame; this one is plain DOM, so it's always clipped by
   whatever contains it. */
.dd{position:relative;}
.dd-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);border:1.5px solid var(--line);color:var(--text);border-radius:12px;
  padding:13px 14px;font-size:15px;font-weight:600;font-family:var(--font);min-height:48px;cursor:pointer;}
.dd-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.dd-panel{margin-top:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
  max-height:260px;overflow-y:auto;}
.dd-opt{padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:1px solid var(--line);}
.dd-opt:last-child{border-bottom:0;}
.dd-opt.on{background:var(--accent-dim);color:var(--accent);}

/* Specials poll options — single or multi choice, custom text or team list */
.opt-list{margin-top:10px;}
.opt-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:12px;margin-bottom:7px;cursor:pointer;transition:.13s;font-size:13.5px;font-weight:600;}
.opt-row.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.opt-row.dim{opacity:.4;cursor:not-allowed;}
.opt-crest{width:22px;height:22px;object-fit:contain;flex-shrink:0;}

.lb-row{display:grid;grid-template-columns:26px 30px 1fr auto auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
.lb-row:last-child{border-bottom:0;}
.lb-row.me{background:var(--accent-dim);margin:0 -15px;padding-left:15px;padding-right:15px;border-radius:10px;}
.rank{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--dim);}
.rank.top{color:var(--accent);}
.delta{font-size:10px;font-weight:800;font-family:var(--mono);}
.delta.up{color:var(--ok);}.delta.dn{color:var(--danger);}.delta.same{color:var(--dim);opacity:.5;}
.pts{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;}

.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.field input{width:100%;background:var(--panel);border:1.5px solid var(--line);color:var(--text);border-radius:12px;
  padding:13px 14px;font-size:15px;font-weight:600;font-family:var(--font);min-height:48px;}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}

/* Was a hardcoded 3-column grid — broke into two rows once the wizard grew
   to 5 steps (2026-08-05). Flex adapts to however many <i> steps exist, so
   it can't silently break again if the step count changes later. */
.steps{display:flex;gap:5px;margin-bottom:15px;}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);display:block;transition:.3s;}
.steps i.on{background:var(--accent);}

.sport{flex:1;border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:16px 10px;text-align:center;
  cursor:pointer;font-weight:700;font-size:12.5px;min-height:86px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;font-family:var(--font);color:var(--text);transition:.15s;}
.sport:hover:not(.disabled){transform:translateY(-2px);border-color:rgba(var(--accent-rgb),.4);}
.sport.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.sport.disabled{opacity:.38;cursor:not-allowed;}

.hero-card{border-radius:22px;padding:100px 18px 20px;margin-bottom:13px;position:relative;overflow:hidden;
  background-image:var(--hero);background-size:cover;background-position:center;border:1px solid var(--line);}
.hero-card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 8%,var(--panel) 96%);}
.hero-card>*{position:relative;z-index:1;}
.hero-card h2{font-family:var(--display);font-size:26px;line-height:1.1;margin:7px 0;}

.google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#141821;
  border:1.5px solid var(--line);border-radius:14px;padding:15px;font-weight:700;font-size:14.5px;cursor:pointer;
  min-height:52px;font-family:var(--font);transition:.14s;}
.google:hover{box-shadow:0 6px 18px -8px rgba(0,0,0,.35);transform:translateY(-1px);}

.note{font-size:12px;line-height:1.55;color:var(--dim);border-left:3px solid var(--line);padding:5px 0 5px 11px;margin-top:13px;}
.note.flag{border-left-color:var(--warn);color:var(--warn);}
.note b{color:var(--text);}
.pos{color:var(--ok);font-weight:800;font-family:var(--mono);}
.zero{color:var(--dim);font-weight:800;font-family:var(--mono);}
.break-row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
.break-row:last-child{border-bottom:0;}
.break-row img{width:28px;height:28px;object-fit:contain;}

.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:40;background:var(--accent);color:var(--on-accent);
  padding:13px 15px;border-radius:14px;font-size:13px;font-weight:700;display:none;box-shadow:0 16px 40px rgba(0,0,0,.3);}
.toast.show{display:flex;align-items:center;gap:8px;animation:tUp .26s cubic-bezier(.22,1,.36,1);}
@keyframes tUp{from{transform:translateY(14px);opacity:0}}

.mini-tabs{display:flex;gap:16px;margin:0 0 14px;overflow-x:auto;border-bottom:1px solid var(--line);}
.mini-tabs::-webkit-scrollbar{height:0;}
.mini-tabs button{flex:0 0 auto;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--dim);
  padding:0 1px 9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:32px;transition:.14s;}
.mini-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);}

/* compact inline countdown — used inside match-card where a big block is too heavy */
.cd-wrap.compact{padding:8px 11px;gap:8px;margin-top:10px;}
.cd-inline{font-family:var(--mono);font-weight:700;font-size:13px;}
.cd-inline-label{font-size:11px;opacity:.8;margin-left:auto;font-weight:600;}

/* special event — collapsed banner by default, expands on tap */
.special-banner{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:14px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:13px;transition:.14s;}
.special-banner:hover{border-color:rgba(var(--accent-rgb),.4);}
/* Chips that act as tap targets (unpaid shortcut, role toggle) got cursor:
   pointer but no hover feedback, unlike every other tappable element in the
   app (reported 2026-08-05). */
.chip-tap{transition:transform .12s,filter .12s;}
.chip-tap:hover{filter:brightness(.93);transform:translateY(-1px);}
/* Prize-split sliders (2026-08-05) — no native range-input styling exists
   anywhere else in the app, so this is built from scratch to match: accent
   thumb, --line track, same rounding/shadow language as buttons and chips. */
.split-slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--line);outline:none;cursor:pointer;display:block;}
.split-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;}
.split-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;}
.split-slider::-moz-range-track{height:6px;border-radius:6px;background:var(--line);}
.special-banner .sb-ic{width:26px;height:26px;border-radius:9px;background:var(--accent-dim);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.special-banner .sb-txt{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.special-banner .sb-sub{font-size:10.5px;color:var(--dim);font-weight:600;}
.special-card.compact{padding:13px;}

.callout{border-radius:15px;padding:13px 15px;background:var(--ok-dim);border:1px solid rgba(14,159,110,.28);
  font-size:12.5px;color:var(--ok);line-height:1.5;margin-bottom:13px;}
[data-theme="light"] .callout{color:#08674a;}
.callout b{color:var(--ok);}

.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px;}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

#fx{position:absolute;inset:0;pointer-events:none;z-index:35;}

/* ══════════════════════════════════════
   ONBOARDING WALKTHROUGH (Blinkit-style spotlight)
══════════════════════════════════════ */
.device{position:relative;}
#wt-svg{position:absolute;inset:0;width:100%;height:100%;z-index:9001;pointer-events:none;display:none}
#wt-blocker{position:absolute;inset:0;z-index:9002;cursor:default;display:none}
#wt-pulse-ring{
  position:absolute;z-index:9003;border:2px solid var(--accent);border-radius:14px;
  pointer-events:none;display:none;
  animation:wt-pulse-anim 1.8s ease-in-out infinite;
  box-shadow:0 0 0 0 rgba(var(--accent-rgb),.35);
  transition:all .35s cubic-bezier(.4,0,.2,1);
}
@keyframes wt-pulse-anim{
  0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.35)}
  60%{box-shadow:0 0 0 12px rgba(var(--accent-rgb),0)}
  100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),0)}
}
#wt-card{
  position:absolute;z-index:9010;width:min(252px,calc(100% - 24px));
  background:var(--panel);border:1.5px solid var(--accent);border-radius:16px;
  box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 1px rgba(var(--accent-rgb),.12);
  overflow:hidden;display:none;
  transition:top .35s cubic-bezier(.4,0,.2,1),left .35s cubic-bezier(.4,0,.2,1),opacity .25s;
}
#wt-card.show{display:block}
.wt-card-header{
  background:var(--accent);color:var(--on-accent);padding:8px 12px 7px;
  display:flex;align-items:center;gap:7px;
}
.wt-card-logo{
  width:20px;height:20px;border-radius:6px;background:var(--on-accent);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;
  font-family:var(--display);flex-shrink:0;
}
.wt-card-section{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;flex:1;opacity:.92}
.wt-card-counter{font-size:8.5px;font-weight:700;opacity:.7}
.wt-card-body{padding:11px 12px}
.wt-card-title{font-family:var(--display);font-size:13.5px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:5px;color:var(--text)}
.wt-card-text{font-size:11.5px;color:var(--muted);line-height:1.5}
.wt-card-text b{color:var(--text);font-weight:700}
.wt-card-text .hl{color:var(--accent);font-weight:700}
.wt-deepdive{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}
.wt-deepdive-toggle{
  display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);cursor:pointer;font-weight:800;background:none;border:none;font-family:var(--font);padding:0
}
.wt-deepdive-toggle .dd-arrow{transition:transform .2s;display:inline-block}
.wt-deepdive-toggle.open .dd-arrow{transform:rotate(180deg)}
.wt-deepdive-body{display:none;margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.65}
.wt-deepdive-body b{color:var(--text)}
.wt-deepdive-body.open{display:block}
.wt-progress{display:flex;align-items:center;gap:4px;padding:0 12px 9px}
.wt-dot{height:3px;border-radius:2px;background:var(--line);transition:all .3s;flex:1}
.wt-dot.done,.wt-dot.active{background:var(--accent)}
.wt-dot.active{flex:2}
.wt-footer{display:flex;align-items:center;gap:7px;padding:0 12px 12px}
.wt-btn{
  flex:1;padding:9px;border-radius:11px;border:none;font-size:11.5px;font-weight:800;
  cursor:pointer;font-family:var(--font);transition:opacity .15s
}
.wt-btn:hover{opacity:.9}
.wt-btn-primary{background:var(--accent);color:var(--on-accent)}
.wt-btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--line);flex:none;padding:9px 11px}
.wt-btn-skip{background:transparent;color:var(--dim);border:none;font-size:10.5px;flex:none;padding:9px 4px;font-weight:700;cursor:pointer;font-family:var(--font)}
#wt-help-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--font);
  font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;min-height:36px
}
#wt-help-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
#wt-welcome{
  position:absolute;inset:0;z-index:9020;background:rgba(15,18,25,.88);
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:16px;
}
#wt-welcome.show{display:flex}
.wt-welcome-card{
  width:100%;max-width:320px;background:var(--panel);border:1.5px solid var(--accent);
  border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);
  animation:wt-slide-up .35s cubic-bezier(.4,0,.2,1)
}
@keyframes wt-slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.wt-welcome-hero{background:var(--accent);color:var(--on-accent);padding:22px 18px 18px;text-align:center}
.wt-welcome-hero .logo{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.wt-welcome-hero .sub{font-size:12px;opacity:.85;margin-top:4px;font-weight:600}
.wt-welcome-body{padding:16px 16px 18px}
.wt-welcome-body p{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0 0 14px}
.wt-welcome-actions{display:flex;flex-direction:column;gap:8px}
.wt-welcome-actions button{
  width:100%;border:0;border-radius:12px;padding:12px 14px;font-family:var(--font);
  font-weight:800;font-size:13px;cursor:pointer;min-height:44px;text-align:left
}
.wt-welcome-actions .primary{background:var(--accent);color:var(--on-accent)}
.wt-welcome-actions .secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.wt-welcome-actions .ghost{background:transparent;color:var(--dim);font-size:12px;font-weight:700;text-align:center;min-height:36px}
.wt-welcome-actions small{display:block;font-weight:600;font-size:11px;opacity:.8;margin-top:2px}



  .tour-panel.show{align-self:flex-start}
}

<body>
<div class="stage">
  <div class="topbar">
    <div class="brand-row">
      <div id="logoMark"></div>
      <div class="brand-block">
        <div class="eyebrow">Predictopia · interactive prototype — clickable demo, mock data, no live backend</div>
      </div>
    </div>
    <div class="right-controls">
      <div class="theme-toggle" id="themeToggle"></div>
    </div>
  </div>

  <div class="layout">
    <div class="device-wrap">
      <div class="device">
        <div class="statusbar">
          <span id="sbTime">—</span>
          <span class="sb-r" id="sbIcons"></span>
        </div>
        <div class="device-body" id="screen"></div>
        <canvas id="fx"></canvas>
        <div class="toast" id="toast"></div>

<!-- Walkthrough overlays (scoped to phone device) -->
<svg id="wt-svg" aria-hidden="true">
  <defs>
    <mask id="wt-mask">
      <rect width="100%" height="100%" fill="white"/>
      <rect id="wt-hole" x="0" y="0" width="0" height="0" rx="14" fill="black"/>
    </mask>
  </defs>
  <rect width="100%" height="100%" fill="rgba(10,12,18,.5)" mask="url(#wt-mask)"/>
</svg>
<div id="wt-blocker"></div>
<div id="wt-pulse-ring"></div>
<div id="wt-card">
  <div class="wt-card-header">
    <div class="wt-card-logo">P</div>
    <div class="wt-card-section" id="wt-section">Section</div>
    <div class="wt-card-counter" id="wt-counter">1 / 10</div>
  </div>
  <div class="wt-card-body">
    <div class="wt-card-title" id="wt-title">Title</div>
    <div class="wt-card-text" id="wt-text">Text</div>
    <div class="wt-deepdive" id="wt-deepdive" style="display:none">
      <button type="button" class="wt-deepdive-toggle" id="wt-dd-toggle" onclick="wtToggleDeepDive()"><span class="dd-arrow">▼</span> Go deeper</button>
      <div class="wt-deepdive-body" id="wt-dd-body"></div>
    </div>
  </div>
  <div class="wt-progress" id="wt-progress"></div>
  <div class="wt-footer">
    <button type="button" class="wt-btn-skip" onclick="wtSkip()">Skip</button>
    <button type="button" class="wt-btn wt-btn-secondary" id="wt-back-btn" onclick="wtBack()">Back</button>
    <button type="button" class="wt-btn wt-btn-primary" id="wt-next-btn" onclick="wtNext()">Next →</button>
  </div>
</div>
<div id="wt-welcome">
  <div class="wt-welcome-card">
    <div class="wt-welcome-hero">
      <div class="logo">Predictopia</div>
      <div class="sub">Interactive prototype · guided walkthrough</div>
    </div>
    <div class="wt-welcome-body">
      <p>A quick, six-stop spotlight tour — pick the path you want to see.</p>
      <div class="wt-welcome-actions">
        <button type="button" class="primary" onclick="wtBegin('member')">Member tour<small>Join → predict → board → money</small></button>
        <button type="button" class="secondary" onclick="wtBegin('admin')">Admin tour<small>Group · pool · specials · settle</small></button>
        <button type="button" class="ghost" onclick="wtSkip()">Skip for now</button>
      </div>
    </div>
  </div>
</div>

        <nav class="tabbar" id="tabbar" data-wt="tabbar">
          <button data-go="home" data-wt="tab-home"><span data-icon="home" data-size="21"></span>Home</button>
          <button data-go="groups" data-wt="tab-groups"><span data-icon="users" data-size="21"></span>Groups</button>
          <button data-go="predictHub" data-wt="tab-predict"><span data-icon="target" data-size="21"></span><span class="badge" id="predictBadge">2</span>Predict</button>
          <button data-go="profile" data-wt="tab-you"><span data-icon="user" data-size="21"></span>You</button>
        </nav>
      </div>
    </div>
      <div class="tour-meta" id="tourMeta">Step 1 of 8</div>
      <h3 id="tourTitle">Title</h3>
      <p id="tourBody">Body</p>
      <div class="tour-actions">
        <button type="button" class="btn-sm ghost" onclick="endTour()">Skip</button>
        <button type="button" class="btn-sm ghost" id="tourPrev" onclick="tourPrev()">Back</button>
        <span class="spacer"></span>
        <button type="button" class="btn-sm primary" id="tourNext" onclick="tourNext()">Next</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ══════════ icons ══════════ */
const IP={
 home:`<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>`,
 users:`<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17.5" cy="9" r="2.3"/><path d="M15.7 14.5c2.2.5 4.3 2.1 4.3 5"/>`,
 target:`<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>`,
 user:`<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/>`,
 lock:`<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>`,
 clock:`<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/>`,
 cap:`<path d="M2 9 12 4l10 5-10 5-10-5Z"/><path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/><path d="M22 9v6"/>`,
 cricket:`<circle cx="17.5" cy="6.5" r="2.2"/><path d="M15.8 8.2 5 19"/><path d="M3.3 20.7 5 19l1.7 1.7-1.7 1.7z"/>`,
 football:`<circle cx="12" cy="12" r="8"/><path d="m12 7.8 3.2 2.2-1.2 3.7H10l-1.2-3.7Z"/><path d="M12 4v3.8M9.2 19.6 10 13.7M14.8 19.6 14 13.7M4.6 9.4l3.4 1.2M19.4 9.4l-3.4 1.2"/>`,
 tennis:`<circle cx="12" cy="12" r="8"/><path d="M6.3 5.8c2.6 2.3 2.6 10.1 0 12.4M17.7 5.8c-2.6 2.3-2.6 10.1 0 12.4"/>`,
 sun:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>`,
 moon:`<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>`,
 share:`<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V4M8 8l4-4 4 4"/>`,
 sig:`<path d="M3 18h2M8.5 14h2M14 10h2M19.5 6h2" stroke-width="3"/>`,
 bat:`<rect x="2" y="8" width="17" height="9" rx="2.5"/><path d="M21 11v3"/><rect x="4" y="10" width="12" height="5" rx="1" fill="currentColor" stroke="none"/>`,
 wifi:`<path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/>`,
 chevR:`<path d="m9 5 7 7-7 7"/>`, chevL:`<path d="m15 5-7 7 7 7"/>`, chevD:`<path d="m6 9 6 6 6-6"/>`,
 check:`<path d="m5 12.5 4.5 4.5L19 7"/>`,
 bell:`<path d="M18 15V10a6 6 0 1 0-12 0v5l-1.5 3h15Z"/><path d="M10 21h4"/>`,
};
const icon=(n,s=20,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IP[n]||''}</svg>`;
const logo=(s=36)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none">
  <rect x="1.5" y="1.5" width="37" height="37" rx="12" fill="var(--accent)"/>
  <path d="M12 20.5 17.5 26 29 14" stroke="var(--on-accent)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function hydrate(r){r&&r.querySelectorAll('[data-icon]').forEach(e=>{if(!e.dataset.done){e.innerHTML=icon(e.dataset.icon,+e.dataset.size||20);e.dataset.done=1;}});}

/* ══════════ theme ══════════ */
let theme='light';
function setTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);chrome();render();}
function chrome(){
  themeToggle.innerHTML=`<button class="${theme==='light'?'on':''}" onclick="setTheme('light')">${icon('sun',14)}Light</button>
    <button class="${theme==='dark'?'on':''}" onclick="setTheme('dark')">${icon('moon',14)}Dark</button>`;
  logoMark.innerHTML=logo(38);
  sbIcons.innerHTML=icon('sig',15)+icon('wifi',15)+icon('bat',17);
}

/* ══════════ time — ALWAYS viewer-local ══════════ */
const T0=Date.now();
const LOCK={cricket:T0+(2*3600+14*60)*1000, football:T0+4*3600*1000, next:T0+26*3600*1000};
const WIN=24*3600*1000;                       // prediction window length, for the ring
const fmtT=ms=>new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(ms));
const fmtTZ=ms=>new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(ms));
function dur(ms){
  if(ms<=0)return{s:'LOCKED',l:'Picks are final',cls:'cd-calm',p:1};
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  const txt=h>0?`${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`:`${m}m ${String(s).padStart(2,'0')}s`;
  return{s:txt,l:'until picks lock',cls:ms<3600000?'cd-urgent':'cd-warn',p:1-Math.min(1,ms/WIN)};
}
/* Compact single-line countdown — the only variant actually used anywhere
   in the product; a heavier SVG-ring version existed but was never called,
   so it (and its CSS/tick-update code) was removed as dead weight
   (2026-08-02, Grok review). */
function countdownInline(target,label){
  const d=dur(target-Date.now());
  return `<div class="cd-wrap compact ${d.cls==='cd-urgent'?'urgent':d.cls==='cd-calm'?'locked':''} ${d.cls}" data-cd="${target}" data-inline="1">
    ${icon('clock',15)}<span class="cd-inline">${d.s}</span><span class="cd-inline-label">${label||d.l}</span></div>`;
}
setInterval(()=>{
  sbTime.textContent=fmtT(Date.now());
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const d=dur(+el.dataset.cd-Date.now());

/* ══════════ fx: themed celebrations ══════════ */
const cvs=document.getElementById('fx'),ctx=cvs.getContext('2d');
let parts=[];
function themedBurst(colors,shape){
  if(!ctx)return;
  const r=cvs.getBoundingClientRect();cvs.width=r.width;cvs.height=r.height;
  for(let i=0;i<42;i++)parts.push({x:r.width/2,y:r.height*.4,vx:(Math.random()-.5)*7,vy:Math.random()*-7-2,
    r:Math.random()*4+2,c:colors[i%colors.length],life:1,rot:Math.random()*6,shape:shape||'rect'});
  if(parts.length)requestAnimationFrame(tick);
}
function burst(){themedBurst([getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),'#e8492f','#0e9f6e','#0284c7']);}
function tick(){
  if(!ctx)return;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.26;p.life-=.014;p.rot+=.18;
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.c;
    if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();}
    else ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
    ctx.restore();});
  if(parts.length)requestAnimationFrame(tick);else ctx.clearRect(0,0,cvs.width,cvs.height);
}
function flashText(txt,cls){
  const host=document.querySelector('.device');if(!host)return;
  const el=document.createElement('div');el.className='flash '+cls;
  el.innerHTML=`<div class="ftxt">${txt}</div>`;host.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>el.remove(),950);
}
/* Themed to the sport being predicted — not a claim the event happened, just a
   celebratory confirmation that the pick is locked in. Football → goal-net
   colours. Cricket → wicket/six colours. Generic → used for non-sport moments
   (joining a pool, creating a pool). */
function goalFX(){flashText('⚽ GOAL!','goal');themedBurst(['#0ea968','#0284c7','#ffffff','#7dd3fc'],'circle');}

/* ══════════ count-up ══════════ */
function countUp(root){
  root.querySelectorAll('[data-cu]').forEach(el=>{
    const to=+el.dataset.cu,t0=performance.now(),D=650;
    (function step(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);
      el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(step);})(t0);
  });
}

/* Pure — no state or DOM writes. Proportional auto-balance: the dragged/typed
   rank takes its new value outright; every other rank absorbs its share of
   what's left, in proportion to its own current value (so relative weighting
   among the untouched ranks is preserved). Non-last others use floor() so
   they can never cumulatively overshoot what's left; the last other takes
   the exact remainder — that's what guarantees the total is always exactly
   100, not just approximately. Shared by both update paths below so the
   math can't drift between them. */
function computeSplitRedistribution(split,idx,rawVal){
  const next=[...split],n=next.length;
  const val=Math.max(0,Math.min(100,Math.round(Number(rawVal)||0)));
  if(n<2){next[idx]=100;return next;}
  const others=next.map((_,i)=>i).filter(i=>i!==idx);
  const othersTotal=others.reduce((s,i)=>s+(Number(next[i])||0),0);
  const remaining=100-val;
  let used=0;
  others.forEach((i,k)=>{
    if(k===others.length-1)return;
    const share=othersTotal>0?Math.floor((Number(next[i])||0)/othersTotal*remaining):Math.floor(remaining/others.length);
    next[i]=Math.max(0,share);
    used+=next[i];
  });
  next[others[others.length-1]]=Math.max(0,remaining-used);
  next[idx]=val;
  return next;
}
/* Commits to state + full render(). Used by the number box (typing already
   re-renders safely every keystroke — data-field focus/caret is preserved,
   same mechanism every other text field in the app already relies on) and
   the slider's onchange, which fires once at drag-end. */
function updateSplitSlider(splitKey,idx,rawVal){
  state[splitKey]=computeSplitRedistribution(state[splitKey],idx,rawVal);

/* Slider's oninput (fires continuously while dragging) — writes straight to

   the slider element on every pixel of movement — that silently converts a
   native drag into "click a point on the track" in every browser, because
   the browser's drag-tracking is tied to that specific DOM node instance.
   Keeping the dragged node untouched (never re-assign its own .value from
   script mid-gesture) is what keeps the native drag alive; the *other*
   ranks' sliders/boxes/amounts are updated directly since they're not the

function liveDragSplit(splitKey,idx,rawVal,pot,currency){

const CUR={INR:{s:'₹',locale:'en-IN'},USD:{s:'$',locale:'en-US'},GBP:{s:'£',locale:'en-GB'},EUR:{s:'€',locale:'de-DE'}};

function fmtByCurrency(entries){

/* Two-layer admin model, resolved 2026-08-05 (see Decision Log): Group Admin
   is a persistent role — the creator by default, and a Group Admin can add
   or remove co-admins from GROUPS[gk].admins (see toggleGroupAdmin below).
   Group Admins administer every Pool under their Group for free. On top of
   that, Pool-level admin still exists independently — whoever creates a
   Pool becomes that pool's admin (they were necessarily a Group Admin at
   creation time, since pool creation is Group-Admin-only as of 2026-08-06 —
   see the SUPERSEDES entry reversing the old "any member" viral-loop
   precedent), but can go on to lose or never hold the Group-wide role
   afterward while keeping that Pool's admin seat. Venkat on IPL Buddies is
   exactly this: Pool-admin there, plain Member of College Friends overall
   (Sid holds that Group's admin seat) — seeded directly to prove the two
   layers stay independently real, not collapsed into one flag, without
   depending on the create-pool flow to reach that state. */

   the viewer have anything pending here" answer. Two shared functions so
   the three surfaces can't quietly drift into disagreeing with each other. */

/* Buy-in and prize winnings stay separate figures, never netted — the app
   tracks money, it never moves it, so a combined "net" figure would imply
   a settlement calculation that doesn't actually happen. hasMoney flags
   whether this pool has any money concept at all (skips the ₹0 bragging-
   rights pools like Cousins IPL from needing a hollow buy-in line). */
function myPoolMoney(poolKey){
  const pool=POOLS[poolKey];
  const myPayment=pool.payments.find(m=>m.a==='V');
  const buyInCollected=pool.buyIn>0?!!(myPayment&&myPayment.paid):true;
  let owedTotal=0,settledTotal=0;
  const tally=payouts=>Object.values(payouts||{}).forEach(p=>p.winners.forEach(w=>{
    if(w.a!=='V')return;
    if(w.paid)settledTotal+=w.amount;else owedTotal+=w.amount;
  }));
  tally(pool.payouts);tally(pool.specialPayouts);
  return{buyInCollected,buyInAmount:pool.buyIn,owedTotal,settledTotal,currency:pool.currency,
    hasMoney:pool.buyIn>0||owedTotal>0||settledTotal>0};
}
/* Home's context-aware next action (2026-08-06, locked priority order):
   1. Predict — any open pick, cutoff-bound so it always wins.
   2. Money — nothing open, but owed unsettled prize or buy-in not collected.
   3. Wait — otherwise (all predicted, nothing owed).
   Tap target stays simple/binary regardless of label, per explicit
   instruction — open picks land on Predict, everything else lands on
   Board (never straight to Money from the card), since Board's own Money
   tab is one more tap away and the card is just a signal, not a shortcut. */
function homeCardMeta(poolKey){
  const pool=POOLS[poolKey],open=hasOpenPicks(poolKey),my=myPoolMoney(poolKey);
  const owed=my.owedTotal>0||(pool.buyIn>0&&!my.buyInCollected);
  const label=open?'Predict':owed?'Money':'Wait';
  const screen=open?(pool.sport==='cricket'?'poolPredict':'poolFootball'):'poolBoard';
  return{open,owed,label,screen,my};
}

   from admining any pool underneath it (that was the pre-2026-08-05 model). */

function toggleGroupAdmin(gk,i){

/* Leave/remove — real gap closed 2026-08-05. v1 had this fully decided
   (2026-03-27: Creator+Admins remove members, only Creator removes admins,
   admins self-demote by leaving) but it never carried into v2's Group/Pool
   split. Shared helper so leaving a Group and being removed from one behave
   identically for the pool-cascade side — only the toast/navigation differs. */
function removeMemberFromPool(poolKey,initial){
  const pool=POOLS[poolKey];
  const idx=pool.payments.findIndex(m=>m.a===initial);
  if(idx>-1){pool.payments.splice(idx,1);pool.members=Math.max(0,pool.members-1);}
  const aIdx=pool.admins.indexOf(initial);
  if(aIdx>-1)pool.admins.splice(aIdx,1);
}
/* Tap-to-arm confirm (2026-08-05) — leave/remove are the only irreversible
   actions in the app (everything else is a toggle you can flip back), so
   they're the only ones gated. First tap arms the button (shows "Confirm?"
   for 3s), second tap within that window actually runs it — no native
   confirm() popup, which would be the one native browser dialog in an
   otherwise fully custom UI. Same key scheme also drives the button's own
   armed/idle rendering — see isArmed() at each call site. */
function isArmed(key){return state.confirmArmed===key;}
function armOrRun(key,fn){
  if(state.confirmArmed===key){state.confirmArmed=null;fn();return;}
  state.confirmArmed=key;render();
  clearTimeout(armOrRun._t);
  armOrRun._t=setTimeout(()=>{if(state.confirmArmed===key){state.confirmArmed=null;render();}},3000);
}
function leavePool(poolKey){
  armOrRun('leavePool:'+poolKey,()=>{
    const pool=POOLS[poolKey];
    removeMemberFromPool(poolKey,'V');
    toast(`You left ${pool.name} — still in ${pool.group}, can opt back in later`);
    go('home');
  });
}
function removeFromPool(poolKey,idx){
  const pool=POOLS[poolKey],m=pool.payments[idx];
  if(!m||m.a==='V')return;
  armOrRun('rmPool:'+poolKey+':'+m.a,()=>{
    removeMemberFromPool(poolKey,m.a);
    toast(`${m.n} removed from ${pool.name}`);
    render();
  });
}
/* Removing/leaving a Group cascades to every Pool under it — Pool
   participation is opt-in *from* Group membership (2026-08-01), so it
   can't survive the Group membership it was opted in from. */
function removeFromGroup(gk,i){
  if(i==='V')return;
  armOrRun('rmGroup:'+gk+':'+i,()=>{
    const g=GROUPS[gk],idx=g.avatars.indexOf(i);
    if(idx>-1){g.avatars.splice(idx,1);g.members=Math.max(0,g.members-1);}
    const aIdx=g.admins.indexOf(i);
    if(aIdx>-1)g.admins.splice(aIdx,1);
    const cascaded=Object.keys(POOLS).filter(k=>POOLS[k].groupKey===gk);
    cascaded.forEach(k=>removeMemberFromPool(k,i));
    toast(`${memberName(gk,i)} removed from ${g.name}${cascaded.length?` and ${cascaded.length} pool${cascaded.length>1?'s':''} under it`:''}`);
    render();
  });
}
function leaveGroup(gk){
  armOrRun('leaveGroup:'+gk,()=>{
    const g=GROUPS[gk],idx=g.avatars.indexOf('V');
    if(idx>-1){g.avatars.splice(idx,1);g.members=Math.max(0,g.members-1);}
    const aIdx=g.admins.indexOf('V');
    if(aIdx>-1)g.admins.splice(aIdx,1);
    const cascaded=Object.keys(POOLS).filter(k=>POOLS[k].groupKey===gk);
    cascaded.forEach(k=>removeMemberFromPool(k,'V'));
    toast(`You left ${g.name}${cascaded.length?` and ${cascaded.length} pool${cascaded.length>1?'s':''} under it`:''}`);
    go('groups');
  });
}
/* Group join is the vetting gate (2026-08-05, user's call — the Group, not
   the Pool, is v2's persistent unit, so it's the one that needs to keep
   strangers out; Pool opt-in stays self-serve for people already in the
   Group they're opting in from). Admit is one tap — low-stakes, reversible
   via remove later. Deny gets the same tap-to-arm confirm as remove/leave,
   since rejecting a real person's request is the more consequential one. */
function admitMember(gk,i){
  const g=GROUPS[gk],idx=g.pending.findIndex(p=>p.i===i);
  if(idx===-1)return;
  g.pending.splice(idx,1);
  g.avatars.push(i);
  g.members++;
  toast(`${memberName(gk,i)} admitted to ${g.name}`);
  render();
}
function denyMember(gk,i){
  armOrRun('denyMember:'+gk+':'+i,()=>{
    const g=GROUPS[gk],idx=g.pending.findIndex(p=>p.i===i);
    if(idx===-1)return;
    const name=memberName(gk,i);
    g.pending.splice(idx,1);
    toast(`${name}'s request denied`);
    render();
  });
}

/* Real Web Share API needs a secure context and a user gesture — neither is
   guaranteed from a local file:// prototype, so this degrades honestly:
   native share sheet, else clipboard, else "screenshot this" as the last
   resort that always works. */
async function shareNow(){
  const{title,text}=CURRENT_SHARE;
  if(navigator.share){
    try{await navigator.share({title,text});toast('Shared!');return;}catch(e){/* cancelled or unsupported — fall through */}
  }

  const ak=state.activePool,pool=POOLS[ak],cfg=pool.periodConfig,per=state.period||'overall';

  <button class="back" onclick="go('poolBoard')">${icon('chevL',15)}Board</button>
  <div class="between mb8"><div><div class="kicker">${pool.group}</div>
    <div style="font-family:var(--display);font-size:18px">${pool.name}</div></div></div>
  <div class="display" style="font-size:22px">Picks revealed</div>
  <p class="sub">${pool.name} · same window as the Board — cutoff hit, everyone's pick is visible.</p>
  ${periodPicker(pool,cfg,per)}
  ${revealContent(ak,per)}`;
},

shareCard:()=>{
  const ctx=state.shareContext||{};
  const pool=POOLS[ctx.poolKey]||POOLS[state.activePool];
  let sub,titleLine,previewHTML;
  if(ctx.type==='reveal'){
    const all=Object.values(REVEALS[ctx.poolKey]||{}).flat();
    const m=all[ctx.matchIndex]||all[0];
    const total=m.groups.reduce((s,g)=>s+g.avs.length,0)+m.noPick.length;
    sub=`${pool.name} · ${m.label}`;
    titleLine=`${m.a} vs ${m.b}`;
    previewHTML=`
      <div class="row" style="justify-content:center;gap:16px;margin:12px 0">
        <img style="width:44px;height:44px;object-fit:contain" src="${CREST(m.a)}" alt="">
        <b style="font-size:14px;color:var(--dim)">VS</b>
        <img style="width:44px;height:44px;object-fit:contain" src="${CREST(m.b)}" alt="">
      </div>
      ${m.groups.map(g=>`
        <div class="between" style="margin-bottom:8px">
          <div class="row" style="gap:5px">${g.avs.map(i=>`<img class="av sm" src="${AV(i)}" alt="">`).join('')}</div>
          <span class="chip chip-muted">${g.pick} · ${Math.round(g.avs.length/total*100)}%</span>
        </div>`).join('')}
      ${m.noPick.length?`<div class="row" style="gap:7px;margin-top:4px">
        <div class="row" style="gap:5px">${m.noPick.map(i=>`<img class="av sm" src="${AV(i)}" alt="">`).join('')}</div>
        <span style="font-size:11px;color:var(--dim)">missed cutoff</span></div>`:''}`;
    CURRENT_SHARE={title:`${pool.name} — ${m.a} vs ${m.b}`,
      text:`${pool.name} — ${m.a} vs ${m.b}\n`+m.groups.map(g=>`${g.pick}: ${Math.round(g.avs.length/total*100)}% (${g.avs.length} picked)`).join('\n')
        +(m.noPick.length?`\n${m.noPick.length} missed cutoff`:'')+`\n\nPredicted with Predictopia`};
  }else{
    const p=ctx.period||'overall';
    const rows=leaderboardRows(p);
    sub=`${pool.name} · ${periodLabel(pool.periodConfig,p)}`;
    titleLine='Leaderboard';
    previewHTML=`<div style="margin-top:10px">${rows.map(([r,n,a,pt])=>`
      <div class="row" style="justify-content:space-between;padding:7px 0;${r<rows.length?'border-bottom:1px solid var(--line)':''}">
        <div class="row" style="gap:9px"><span style="font-weight:800;color:var(--dim);width:16px">${r}</span>
          <img class="av sm" src="${AV(a)}" alt=""><b style="font-size:13.5px">${n}</b></div>
        <b style="font-size:13.5px">${pt}</b>
      </div>`).join('')}</div>`;
    CURRENT_SHARE={title:`${pool.name} — ${periodLabel(pool.periodConfig,p)}`,
      text:`${pool.name} — ${periodLabel(pool.periodConfig,p)}\n`+rows.map(([r,n,,pt])=>`${r}. ${n} — ${pt} pts`).join('\n')+`\n\nPredicted with Predictopia`};
  }
  return`
  <button class="back" onclick="go(state.shareBack||'home')">${icon('chevL',15)}Cancel</button>
  <div class="display" style="font-size:22px">Share</div>
  <p class="sub">Screenshot this card, or tap Share to send it as text.</p>
  <div class="share-preview">
    <div class="share-brand">${logo(22)}Predictopia</div>
    <div class="kicker" style="margin-top:12px">${sub}</div>
    <div style="font-family:var(--display);font-size:19px">${titleLine}</div>
    ${previewHTML}
  </div>
  <button class="btn btn-accent mt16" onclick="shareNow()">${icon('share',16)}Share</button>
  <button class="btn btn-ghost mt8" onclick="navigator.clipboard&&navigator.clipboard.writeText(CURRENT_SHARE.text).then(()=>toast('Copied — paste it anywhere')).catch(()=>toast('Screenshot this card to share'))">Copy as text</button>`;
},

poolBoard:()=>{
  const ak=state.activePool,pool=POOLS[ak],p=state.period,cfg=pool.periodConfig,admin=isAdminOf(ak);
  const rows=leaderboardRows(p);
  const onSpecials=p==='specials';
  return`
  <button class="back" onclick="go(${state.cameFromDashboard?"'adminDashboard'":"'home'"})">${icon('chevL',15)}${state.cameFromDashboard?'Dashboard':'Home'}</button>
  <div class="between mb8"><div><div class="kicker">${pool.group}</div>
    <div style="font-family:var(--display);font-size:18px">${pool.name}</div></div>
    <div class="row" style="gap:6px">
      ${onSpecials?'':`<button class="btn btn-ghost btn-sm" onclick="openShareLeaderboard('${ak}','${p}')">${icon('share',14)}Share</button>`}
    </div>
  </div>
  ${poolTabs(ak,'board')}
  <p class="sub">${onSpecials?'Admin-authored events, scored separately from match outcomes — same pool, same prize pot.':'Overall total is the truth. Filters are prize-distribution windows, not a second ledger.'}</p>

  <div class="special-banner mb10" onclick="state.cameFromDashboard=false;go('poolMembers')">
    <div class="sb-ic">${icon('user',14)}</div>
    <div class="sb-txt">${pool.members} members<div class="sb-sub">View roster · leave this pool</div></div>
    ${icon('chevR',16)}
  </div>
  <!-- Winners banner removed (v3, 2026-08-06) — Money is now its own tab
       in poolTabs above, so this was a second path to the same screen. -->

  ${periodPicker(pool,cfg,p)}
  ${onSpecials?(pool.specials.length?specialsSummaryCard(pool):`<div class="card" style="text-align:center"><div style="font-weight:800;font-size:14px">No specials pushed to this pool yet</div></div>`):`
  <div class="card">${rows.map(([r,n,a,pt,d])=>`
    <div class="lb-row ${n==='You'?'me':''}">
      <div class="rank ${r<=3?'top':''}">${r}</div>
      <img class="av sm" src="${AV(a)}" alt="">
      <div style="font-weight:700;font-size:13.5px">${n}</div>
      <div class="delta ${d}">${d==='up'?'▲':d==='dn'?'▼':'–'}</div>
      <div class="pts" data-cu="${pt}">0</div></div>`).join('')}</div>
  <button class="btn btn-ghost mt12" onclick="go('breakdown')">Why do I have 18 points?</button>
  <div class="note">${p==='overall'?`Every scored event, all-time — worth ${fmtMoney(pool.prizeOverall,pool.currency)} at season end.`:`${periodLabel(cfg,p)} only, worth ${fmtMoney(pool.prizePerPeriod,pool.currency)} — recognises a period leader without creating a separate score.`}</div>
  <div class="note">Admin set this pool's prize periods to <b>${cfg.type==='matches'?`${cfg.size}-match blocks`:cfg.type==='gameweek'?'gameweeks':'calendar weeks (Sat–Fri)'}</b> — ${cfg.league}. Not a fixed app-wide preset (PRD §7.2). Pool balance and admin fee are visible to the pool admin only — see v1 precedent, Decision Log 2026-08-02.</div>
  ${(()=>{
    const data=REVEALS[ak]||{};
    const allMatches=Object.values(data).flat();
    const matches=p==='overall'?allMatches:(data[p]||[]);
    if(!matches.length)return'';
    return`
  <div class="special-banner mt16" data-wt="reveal" onclick="state.revealExpanded=!state.revealExpanded;render()">
    <div class="sb-ic">${icon('bell',14)}</div>
    <div class="sb-txt">Reveal<div class="sb-sub">${matches.length} match${matches.length>1?'es':''} unlocked — tap to see picks</div></div>
    <span style="display:inline-flex;transform:rotate(${state.revealExpanded?180:0}deg);transition:transform .15s">${icon('chevD',16)}</span>
  </div>
  ${state.revealExpanded?`<div class="mt10">${revealContent(ak,p)}</div>`:''}`;
  })()}`}`;
},

poolEconomics:()=>{
  const ak=state.activePool,pool=POOLS[ak];
  const collected=pool.buyIn*pool.members;
  const fee=collected*(pool.adminFeePct/100);
  const distributable=collected-fee;
  return`
  <button class="back" onclick="go(${state.cameFromDashboard?"'adminDashboard'":"'poolBoard'"})">${icon('chevL',15)}${state.cameFromDashboard?'Dashboard':'Board'}</button>
  <div class="display" style="font-size:22px">Pool economics</div>
  <p class="sub">${pool.name} · admin only — members never see this, only who won and how much (v1 precedent, carried into v2).</p>

  <div class="prize-card" data-wt="economics">
    <div class="row" style="justify-content:space-around">
      <div class="prize-stat"><div class="v">${fmtMoney(collected,pool.currency)}</div><div class="l">Collected</div></div>
      <div class="prize-stat"><div class="v">${fmtMoney(fee,pool.currency)}</div><div class="l">Admin fee ${pool.adminFeePct}%</div></div>
      <div class="prize-stat"><div class="v">${fmtMoney(distributable,pool.currency)}</div><div class="l">Distributable</div></div>
    </div>
  </div>

  <div class="kicker mb8">Pots by type</div>
  <div class="card mb16">
    ${[['Per period',pool.prizePerPeriod],['Season end',pool.prizeOverall]]
      .map(([l,v])=>`<div class="between mb8"><span style="color:var(--dim);font-size:13px">${l}</span><b style="font-size:13px">${v?fmtMoney(v,pool.currency):'—'}</b></div>`).join('')}
    <div class="between"><span style="color:var(--dim);font-size:13px">Specials (${pool.specials.length} pushed)</span><b style="font-size:13px">${pool.specials.length?fmtMoney(pool.specials.reduce((s,x)=>s+x.prize,0),pool.currency):'—'}</b></div>
    ${pool.specials.length?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
      ${pool.specials.map(s=>`<div class="between" style="font-size:11.5px;color:var(--dim);margin-bottom:6px"><span>${s.q}</span><span>${fmtMoney(s.prize,pool.currency)}</span></div>`).join('')}
    </div>`:''}
  </div>

  <button class="btn btn-ghost mb12" onclick="state.cameFromDashboard=${state.cameFromDashboard};go('payouts')">${paidCount(pool)}/${pool.payments.length} collected — view Collected/Not collected</button>
  <div class="note">${fmtMoney(pool.buyIn,pool.currency)} buy-in per person, in ${pool.currency}. Every rupee/dollar/pound moves offline (UPI/cash/bank transfer) — this screen only tracks it.</div>`;
},

payouts:()=>{
  const ak=state.activePool,pool=POOLS[ak];
  return`
  <button class="back" onclick="go(${isAdminOf(ak)&&state.cameFromDashboard?"'adminDashboard'":"'poolEconomics'"})">${icon('chevL',15)}${state.cameFromDashboard?'Dashboard':'Economics'}</button>
  <div class="display" style="font-size:22px">Collected / Not collected</div>
  <p class="sub">${pool.name} · ${fmtMoney(pool.buyIn,pool.currency)} buy-in each · money changes hands offline, this just tracks who's settled.</p>
  <div class="card" data-wt="buyin">
    ${pool.payments.map((m,i)=>`
    <div class="paid-row">
      <div class="row"><img class="av sm" src="${AV(m.a)}" alt=""><b style="font-size:13.5px">${m.n}</b></div>
      <div class="paid-toggle ${m.paid?'paid':'unpaid'}" onclick="togglePaid('${ak}',${i})">${m.paid?'Collected':'Not collected'}</div>
    </div>`).join('')}
  </div>
  <div class="note">Admin-only view. Marking Collected doesn't move money — it's a manual confirmation once you've received it offline (v1 precedent: Approve ≠ Paid). Deliberately worded "Collected/Not collected" here, not "Paid/Unpaid" — that word is reserved for prize winnings on the Money tab (Owed/Settled), a separate flag for the opposite direction of money.</div>`;
},

/* New 2026-08-05 — a pool had no member list at all before this, only the
   Paid/Unpaid screen, which happens to double as a roster but is money-
   framed. Reuses pool.payments for identity (same limitation as Payouts:
   only members with a payment record show up in this demo). Visible to
   everyone, not just the admin — the roster itself isn't sensitive, only
   the money view is (Decision Log 2026-08-02); remove is admin-gated. */
poolMembers:()=>{
  const ak=state.activePool,pool=POOLS[ak],admin=isAdminOf(ak);
  return`
  <button class="back" onclick="go('poolBoard')">${icon('chevL',15)}Board</button>
  <div class="display" style="font-size:22px">Members</div>
  <p class="sub">${pool.name} · ${pool.members} joined</p>
  <div class="card">
    ${pool.payments.map((m,i)=>`
    <div class="paid-row">
      <div class="row"><img class="av sm" src="${AV(m.a)}" alt=""><b style="font-size:13.5px">${m.n}</b></div>
      ${admin&&m.a!=='V'?(()=>{const armed=isArmed('rmPool:'+ak+':'+m.a);return`<button class="btn btn-sm" style="padding:6px 11px;${armed?'background:var(--danger);color:#fff;border-color:var(--danger)':''}" onclick="removeFromPool('${ak}',${i})" title="${armed?'Tap again to confirm':'Remove from pool'}">${armed?'Confirm?':'✕'}</button>`;})():''}
    </div>`).join('')}
  </div>
  <div class="note mb16">${admin?'Removing someone here only opts them out of this Pool — they stay in the Group and can opt back in later. Tap ✕ then ✕ again to confirm.':'Leaving only opts you out of this Pool — you stay in the Group and can opt back in later.'}</div>
  <button class="btn btn-ghost" style="color:var(--danger);border-color:rgba(220,38,38,.3);${isArmed('leavePool:'+ak)?'background:var(--danger-dim)':''}" onclick="leavePool('${ak}')">${isArmed('leavePool:'+ak)?'Tap again to confirm leaving':'Leave pool'}</button>`;
},

breakdown:()=>{const ak=state.activePool,pool=POOLS[ak];return`
  <button class="back" onclick="go('home')">${icon('chevL',15)}Home</button>
  <div class="between mb8"><div><div class="kicker">${pool.group}</div>
    <div style="font-family:var(--display);font-size:18px">${pool.name}</div></div></div>
  ${poolTabs(ak,'me')}
  <div class="display" style="font-size:22px">Score breakdown</div>
  <p class="sub">Every point traces to one event. Fix a result and that one event re-scores — nothing patched by hand.</p>
  <div class="card mb12 between" data-wt="breakdown"><span style="color:var(--dim);font-size:13px">Pool total</span>
    <span style="font-family:var(--display);font-size:30px;color:var(--accent)" data-cu="18">0</span></div>
  <div class="card">
    ${[['CSK','CSK beat GT','Match 38 · correct','+1','pos'],
       ['RCB','MI beat RCB','Match 39 · wrong','0','zero'],
       ['KKR','KKR beat DC','Match 40 · correct','+1','pos'],
       ['SRH','SRH vs PBKS','Match 41 · missed cutoff','0','zero']].map(([c,t,s,v,cl])=>`
      <div class="break-row"><img src="${CREST(c)}" alt="">
        <div><b style="font-size:13px">${t}</b><div style="color:var(--dim);font-size:11.5px">${s}</div></div>
        <span class="${cl}">${v}</span></div>`).join('')}
  </div>
  ${specialsSummaryCard(pool)}`;},

createPool1:()=>`
  <button class="back" onclick="go('groupDetail')">${icon('chevL',15)}Cancel</button>
  <div class="steps" data-wt="create-pool"><i class="on"></i><i></i><i></i><i></i><i></i></div>
  <div class="display" style="font-size:22px">Pick a sport</div>
  <p class="sub">Allowlisted only, so results stay reliable. Cutoff defaults ride with the sport.</p>
  <div class="row mb16">
    <div class="sport ${state.sport==='cricket'?'on':''}" onclick="state.sport='cricket';render()">${icon('cricket',23)}Cricket</div>
    <div class="sport ${state.sport==='football'?'on':''}" onclick="state.sport='football';render()">${icon('football',23)}Football</div>
    <div class="sport disabled">${icon('tennis',23)}More later</div></div>
  <div class="card mb16">
    <div class="between mb8"><span style="color:var(--dim);font-size:13px">Cutoff</span>
      <b style="font-size:13px">${state.sport==='cricket'?'T−30m (fixed)':'T−60/90m (by competition)'}</b></div>
    <div class="between"><span style="color:var(--dim);font-size:13px">Outcomes</span>
      <b style="font-size:13px">${state.sport==='cricket'?'Win / no-result':'Home / Draw / Away'}</b></div></div>
  <button class="btn btn-accent" onclick="go('createPool2')">Continue</button>`,

createPool2:()=>{const c=state.sport==='cricket';return`
  <div class="between"><button class="back" onclick="go('createPool1')">${icon('chevL',15)}Back</button>
  <button class="back" onclick="go('groupDetail')">Exit</button></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
  <div class="display" style="font-size:22px">Pick a competition</div>
  <p class="sub">From the API-backed catalog — not a blank calendar entry.</p>
  ${(c?[['ipl2026','IPL 2026','74 matches · daily sync'],['wc','ICC World Cup','48 matches']]
      :[['epl','Premier League 25/26','380 matches · daily sync'],['ucl','Champions League','125 matches']])
    .map(([k,n,s])=>`<div class="card tap mb10 ${state.competition===k?'glow':''}" onclick="state.competition='${k}';render()">
      <div class="between"><b style="font-size:14px">${n}</b><span class="chip ${c?'chip-accent':'chip-sky'}">API</span></div>
      <div style="font-size:12px;color:var(--dim);margin-top:3px">${s}</div></div>`).join('')}
  <div class="field mb16"><label>Pool name</label><input type="text" data-field="newPoolName" value="${state.newPoolName}" oninput="state.newPoolName=this.value;render()" placeholder="e.g. ${c?'Family Cup':'Family Premier'}"></div>
  <button class="btn btn-accent" onclick="go('createPool3')" ${state.newPoolName.trim()?'':'disabled style="opacity:.5;cursor:not-allowed"'}>Continue</button>`},

/* Split into a 5-step wizard (2026-08-05) — was a single long "Review &
   create" screen mixing period-filter choice, admin economics, pot sizes,
   and the break-even check together. Prize distribution in particular
   needed its own step: auto-suggested winner splits with a live simulation
   don't fit as one more field group on an already-dense screen. */
createPool3:()=>`
  <div class="between"><button class="back" onclick="go('createPool2')">${icon('chevL',15)}Back</button>
  <button class="back" onclick="go('groupDetail')">Exit</button></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
  <div class="display" style="font-size:22px">Admin economics</div>
  <div class="card mb12">${[['Group',GROUPS[state.activeGroup].name],['Sport',state.sport],
    ['Cutoff',state.sport==='cricket'?'T−30m':`T−${FOOTBALL_CUTOFF[state.competition]||90}m`],['Enrollment','Opt-in — no auto-add']]
    .map(([k,v])=>`<div class="between mb8"><span style="color:var(--dim);font-size:13px">${k}</span>
      <b style="font-size:13px;text-transform:capitalize">${v}</b></div>`).join('')}</div>
  <div class="kicker mb8">Prize tracking — settled offline, visible to you only</div>
  <div class="field mb12">
    <label>Currency</label>
    <select onchange="state.newCurrency=this.value;render()" style="width:100%;background:var(--panel);border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;font-family:var(--font);min-height:48px">
      ${Object.keys(CUR).map(c=>`<option value="${c}" ${state.newCurrency===c?'selected':''}>${c} (${CUR[c].s})</option>`).join('')}
    </select>
  </div>
  <div class="row mb16" style="gap:8px">
    <div class="field" style="flex:1"><label>Buy-in per person</label><input type="text" inputmode="numeric" data-field="newBuyIn" value="${state.newBuyIn}" oninput="state.newBuyIn=numVal(this);render()"></div>
    <div class="field" style="flex:1"><label>Min. members to run</label><input type="text" inputmode="numeric" data-field="newMinMembers" value="${state.newMinMembers}" oninput="state.newMinMembers=numVal(this);render()"></div>
    <div class="field" style="flex:1"><label>Admin fee %</label><input type="text" inputmode="numeric" data-field="newAdminFeePct" value="${state.newAdminFeePct}" oninput="state.newAdminFeePct=numVal(this);render()"></div>
  </div>
  <div class="note mb16">App never moves money — buy-in and payouts happen offline. This screen and the fee/balance breakdown are visible to you as admin only; members only ever see who won and how much (v1 rule, Decision Log 2026-08-02). Positioned as a private friends/family pool, tracking-only — accepted at this scale per the 2026-08-05 decision; revisit before opening pools beyond friends/family (PRD §13.2).</div>
  <button class="btn btn-accent" onclick="go('createPool4')">Continue</button>`,

createPool4:()=>{const teams=TEAMS[state.competition]||10,block=Math.round(teams/2);return`
  <div class="between"><button class="back" onclick="go('createPool3')">${icon('chevL',15)}Back</button>
  <button class="back" onclick="go('groupDetail')">Exit</button></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
  <div class="display" style="font-size:22px">Prize distribution</div>
  <p class="sub">Pot sizes, how the Board's period filter is defined, and who gets paid at each — with a suggested split you can adjust.</p>

  <div class="kicker mb8">Board period filter — you choose</div>
  ${[['gameweek','By gameweek','Natural for a round-robin league — one gameweek per period.'],
     ['week','By calendar week','Saturday through Friday, whatever is played in that window.'],
     ['matches',`By ${block}-match blocks`,`${teams} teams in this competition → one full round is ${block} matches.`]]
    .map(([k,l,d])=>`<div class="period-opt ${state.newPeriodType===k?'on':''}" onclick="state.newPeriodType='${k}';state.newSeasonPeriods=defaultSeasonPeriods('${k}',state.competition);render()">
      <div class="between"><b style="font-size:13.5px">${l}</b>${state.newPeriodType===k?icon('check',16):''}</div>
      <div style="font-size:11.5px;color:var(--dim);margin-top:3px">${d}</div></div>`).join('')}
  <div class="note mb16">Not a fixed app-wide preset (PRD §7.2, revised 2026-08-01) — every pool admin sets this per pool.</div>

  <div class="kicker mb8">Pot size by type</div>
  <div class="row mb16" style="gap:8px">
    <div class="field" style="flex:1"><label>Per period</label><input type="text" inputmode="numeric" data-field="newPrizePerPeriod" value="${state.newPrizePerPeriod}" oninput="state.newPrizePerPeriod=numVal(this);render()"></div>
    <div class="field" style="flex:1"><label>Season end</label><input type="text" inputmode="numeric" data-field="newPrizeOverall" value="${state.newPrizeOverall}" oninput="state.newPrizeOverall=numVal(this);render()"></div>
    <div class="field" style="flex:1"><label>Specials default</label><input type="text" inputmode="numeric" data-field="newPrizeSpecial" value="${state.newPrizeSpecial}" oninput="state.newPrizeSpecial=numVal(this);render()"></div>
  </div>
  <div class="row mb16" style="gap:8px">
    <div class="field" style="flex:1"><label>Payout periods this season</label><input type="text" inputmode="numeric" data-field="newSeasonPeriods" value="${state.newSeasonPeriods}" oninput="state.newSeasonPeriods=numVal(this);render()"></div>
  </div>

createPool5:()=>`
  <div class="between"><button class="back" onclick="go('createPool4')">${icon('chevL',15)}Back</button>
  <button class="back" onclick="go('groupDetail')">Exit</button></div>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
  <div class="display" style="font-size:22px">Review &amp; create</div>
  ${(()=>{
    const minM=Number(state.newMinMembers)||0,buyIn=Number(state.newBuyIn)||0,feePct=Number(state.newAdminFeePct)||0;
    const collected=buyIn*minM,fee=collected*(feePct/100),distributable=collected-fee;
    /* Specials default is an estimate: real specials are authored after the
       pool exists, so this is "if one gets pushed at the default amount,"
       not a hard commitment (2026-08-02). */
    const periods=Number(state.newSeasonPeriods)||1;
    const committed=Number(state.newPrizePerPeriod)*periods+Number(state.newPrizeOverall)+Number(state.newPrizeSpecial);
    const net=distributable-committed;
    const netChip=net>0?'chip-ok':net===0?'chip-muted':'chip-coral';
    const netLabel=net>0?`+${fmtMoney(net,state.newCurrency)} buffer`:net===0?'Exactly breakeven':`${fmtMoney(Math.abs(net),state.newCurrency)} short`;
    return`
  <div class="kicker mb8">Will this pool break even?</div>
  <div class="card mb16">
    <div class="between mb8"><span style="color:var(--dim);font-size:13px">Collected at ${minM} members</span><b style="font-size:13px">${fmtMoney(collected,state.newCurrency)}</b></div>
    <div class="between mb8"><span style="color:var(--dim);font-size:13px">Your fee (${feePct}%)</span><b style="font-size:13px">${fmtMoney(fee,state.newCurrency)}</b></div>
    <div class="between mb8"><span style="color:var(--dim);font-size:13px">Distributable to members</span><b style="font-size:13px">${fmtMoney(distributable,state.newCurrency)}</b></div>
    <div class="between" style="padding-top:8px;border-top:1px solid var(--line)"><span style="color:var(--dim);font-size:13px">Prizes committed (${periods} period${periods===1?'':'s'} + season + 1 special est.)</span><b style="font-size:13px">${fmtMoney(committed,state.newCurrency)}</b></div>
    <div class="between" style="margin-top:10px"><span style="font-weight:800;font-size:13.5px">At ${minM} members, you're</span><span class="chip ${netChip}">${netLabel}</span></div>
  </div>
  <div class="note mb16">${net<0?`Below ${minM} members — or if more specials get added — the shortfall grows. Raise the buy-in, lower a pot, or set a higher minimum before opening the pool.`:`This assumes exactly ${minM} members join and only one specials-default event gets pushed — actual specials are authored later and add to what's committed.`}</div>`;})()}
  <div class="note mb16">Admin-authored special events (e.g. "Will X make the playoffs?") can be pushed to this pool any time after creation.</div>
  <button class="btn btn-accent" onclick="createPoolNow()">Create pool</button>`,

profile:()=>{

  /* Real rollup (v3, 2026-08-06) — was wonSoFar, a static seed number never
     touched by closePeriod()/confirmResolve() after this session's payout
     tracking was built, so it silently went stale the moment either ran.
     Now computed live from myPoolMoney() per pool, same helper Home and
     the Money tab use, with fmtByCurrency() since pools run in different
     currencies (a summed single figure would be wrong otherwise — mirrors
     how "You owe" already handled this correctly). "You've won" is total
     winnings (owed+settled) — you won it the moment it's tracked, whether

    ${moneyLines.length?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
      ${moneyLines.map(x=>`<div class="between tap" style="padding:6px 0" onclick="state.activePool='${x.k}';go('poolWinners')">
        <span style="font-size:12.5px">${x.pool.name}</span>

      </div>`).join('')}

      <div class="row" style="gap:7px"><span class="chip chip-muted">${c}</span>${icon('chevR',15)}</div></div>`).join('')}

  <div class="kicker mb8 mt16">Notifications</div>
  <div class="card mb16">
    ${[['notifMatch','Match reminders','Before cutoff, once per match day'],
       ['notifResults','Results & scoring','When a match resolves and points land'],

      <label class="switch"><input type="checkbox" ${state[key]?'checked':''} onchange="state.${key}=this.checked;render()"><span class="slider"></span></label>
    </div>`).join('')}
