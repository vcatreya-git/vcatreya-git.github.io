  <div class="note mb16">Not sent yet — there's no notifications channel in this phase (PRD §13.2, a retention gap since v1). This just saves your preference for when it ships, so you won't need to hunt for the setting later.</div>

      Groups persist, pools are seasons<br>Outcomes score themselves — no admin step<br>

predictHub:()=>{
  /* Grouped by competition, not a flat pool-by-pool list (2026-08-02) —
     sync is a competition-level setting, so it only makes sense to control
     it once per competition group, right where the pools sharing it are
     visibly clustered, instead of forcing a detour into one pool's own
     Predict screen to find the toggle. */
  const byComp={};
  Object.entries(POOLS).forEach(([k,pool])=>{(byComp[pool.competition]=byComp[pool.competition]||[]).push(k);});
  const compLabel=c=>c==='ipl2026'?'IPL 2026':c==='epl'?'EPL 25/26':c;
  /* Aligned with Predict · cricket/football (2026-08-05) — same cutoff chip,
     same matchListBlock pending/locked split and empty state, same specials
     visibility, instead of a flatter, always-full-CTA layout that used to
     diverge from the two pool-scoped Predict screens it's a superset of. */
  const cutoffChip=comp=>comp==='ipl2026'?`<span class="chip chip-accent">T−30m</span>`:`<span class="chip chip-muted">T−${FOOTBALL_CUTOFF[comp]||90}m</span>`;
  return`
  <div class="display" style="font-size:22px">Open predictions</div>
  <p class="sub">Every upcoming match, grouped by tournament — sync lives right here, not just inside a pool.</p>
  ${Object.entries(byComp).map(([comp,poolKeys])=>{
    const synced=state.syncByCompetition[comp];
    const matches=SCHEDULE[comp]||[];
    const multi=poolKeys.length>1;
    const specials=poolKeys.flatMap(k=>POOLS[k].specials.map(s=>({...s,poolKey:k,poolName:POOLS[k].name})));
    return`
    <div class="between mb8 mt16">
      <div class="kicker" style="margin:0">${compLabel(comp)}</div>
      ${cutoffChip(comp)}
    </div>
    <div class="row mb10" style="gap:5px;flex-wrap:wrap">${poolKeys.map(k=>`<span class="chip chip-muted">${POOLS[k].name}</span>`).join('')}</div>
    ${multi?`
    <div class="sync-row mb10">
      <div class="sync-txt"><b>${synced?`Synced across all ${poolKeys.length} pools`:'Independent'}</b>
        <div class="sync-sub">${synced?'One pick applies to every pool above.':'Each pool below keeps its own picks.'}</div></div>
      <label class="switch"><input type="checkbox" ${synced?'checked':''} onchange="toggleSync('${comp}')"><span class="slider"></span></label>
    </div>`:''}
    ${synced||!multi
      ?matchListBlock(poolKeys[0],matches,false)
      :poolKeys.map(k=>`<div class="kicker" style="margin:10px 0 6px">${POOLS[k].name}</div>${matchListBlock(k,matches,false)}`).join('')}
    ${specials.length?`<div class="kicker mb8 mt16">Specials</div>${specials.map(s=>`
    <div class="special-banner mb10" onclick="state.activePool='${s.poolKey}';state.specialExpanded=true;go('${POOLS[s.poolKey].sport==='cricket'?'poolPredict':'poolFootball'}')">
      <div class="sb-ic">${icon('bell',14)}</div>
      <div class="sb-txt">${s.q}<div class="sb-sub">${s.poolName} · ${specialLocked(s)?'Entries closed':s.resolved?'Resolved':'Tap to answer'}</div></div>
      ${icon('chevR',16)}
    </div>`).join('')}`:''}`;
  }).join('')}
  <div class="card tap mt8" onclick="state.activePool='${Object.keys(REVEALS)[0]}';go('poolRevealed')">
    <div class="between"><div><b style="font-size:13.5px">Last reveal room</b>
      <div style="font-size:11.5px;color:var(--dim)">Picks now frozen</div></div>
      <span class="chip chip-coral">Locked</span></div></div>`;
},

      <div style="font-size:11.5px;color:var(--dim);margin-top:3px">Auto-fills all ${teamList.length} teams.</div>

      ${state.newSpecialOptions.length>2?`<button type="button" class="btn btn-ghost btn-sm" style="padding:0 14px" onclick="removeSpecialOption(${i})">✕</button>`:''}

  <div class="card mb16"><div class="kicker" style="margin-bottom:6px">Pushing to</div>

/* Admin hub (2026-08-05) — replaces the standalone "Resolve" tab. Every
   admin action for this pool now has one consistent entry point instead of
   being scattered across Board banners (Members, Economics) and a single-
   purpose tab (Resolve). Deliberately a menu, not one long page — each
   linked screen keeps its own single focus (Predict/Board's "one primary
   decision per screen" convention), this just makes them all one tap away
   from each other instead of requiring a detour back through Board. */
poolAdmin:()=>{
  const ak=state.activePool,pool=POOLS[ak];
  const unresolvedSpecials=pool.specials.filter(s=>!s.resolved).length;
  const notCollected=pool.payments.filter(m=>!m.paid).length;
  const closedPeriods=Object.keys(pool.payouts||{}).length;
  const items=[
    ['user','Members',`${pool.members} joined`,`state.cameFromDashboard=false;go('poolMembers')`],
    ['bell','Pool economics','Collected, fee, payouts — admin only',`state.cameFromDashboard=false;go('poolEconomics')`],
    ['target','Prize distribution','How winners split each pot',`openPrizeSplit('${ak}')`],
    ['check','Money',closedPeriods?`${closedPeriods} period${closedPeriods>1?'s':''} closed`:'No periods closed yet',`state.cameFromDashboard=false;go('poolWinners')`],
    ['bell','Push a special','Add a new admin-authored event',`openSpecialCreate('${ak}',false)`],
    ['check','Resolve specials',unresolvedSpecials?`${unresolvedSpecials} waiting`:pool.specials.length?'All resolved':'None pushed yet',`go('resolveSpecials')`],
    ['lock','Buy-in',notCollected?`${notCollected} not collected`:'All collected',`state.cameFromDashboard=false;go('payouts')`],
  ];
  return`
  <button class="back" onclick="go('home')">${icon('chevL',15)}Home</button>
  <div class="between mb8"><div><div class="kicker">${pool.group}</div>
    <div style="font-family:var(--display);font-size:18px">${pool.name}</div></div></div>

/* ══════════ interactions ══════════ */
/* Sync-or-independent predictions (2026-08-02): if the member's pools share a
   competition and sync is on, one pick mirrors to all of them. Sync off →
   each pool keeps its own independent pick for the same match. */
/* Picks are per-match now, not per-pool (2026-08-02) — state.picks[poolKey]
   is an object keyed by match id. Sync still cascades to every sibling pool
   sharing the competition, same as before, just one match at a time. */
function pick(poolKey,matchId,val){
  const pool=POOLS[poolKey],comp=pool.competition;
  const sync=state.syncByCompetition[comp];
  const targets=sync?Object.keys(POOLS).filter(k=>POOLS[k].competition===comp):[poolKey];
  const first=!(state.picks[poolKey]&&state.picks[poolKey][matchId]);
  targets.forEach(k=>{state.picks[k]=state.picks[k]||{};state.picks[k][matchId]=val;});
  if(state.expandedMatch===matchId)state.expandedMatch=null;
  render();
  if(first){ pool.sport==='cricket'?wicketFX():goalFX(); }
  toast((val==='DRAW'?'Draw':val)+' picked'+(targets.length>1?` — synced to ${targets.length} pools`:' — editable until cutoff'));
}
function toggleSync(comp){
  state.syncByCompetition[comp]=!state.syncByCompetition[comp];
  if(state.syncByCompetition[comp]){
    const src=state.picks[state.activePool]||{};
    Object.keys(POOLS).forEach(k=>{if(POOLS[k].competition===comp)state.picks[k]={...src};});
  }
  render();
}
/* Mutates the one source of truth POOLS[k].payments — both the admin Payouts
   screen and the member's own "what do I owe" summary read from this, so a
   change here is instantly correct everywhere it's shown. */
function togglePaid(poolKey,idx){
  const m=POOLS[poolKey].payments[idx];
  m.paid=!m.paid;
  toast(`${m.n} marked ${m.paid?'Collected':'Not collected'}`);
  render();
}

          <span class="chip ${g.pick===m.you?'chip-accent':'chip-muted'}">${g.pick} · ${Math.round(g.avs.length/total*100)}%</span>
        </div>`).join('')}
      ${m.noPick.length?`<div class="row" style="gap:7px;margin-top:2px">
        <div class="row" style="gap:5px">${m.noPick.map(i=>`<img class="av sm" src="${AV(i)}" alt="">`).join('')}</div>
        <span style="font-size:11px;color:var(--dim)">missed cutoff · 0 points</span></div>`:''}
      <button class="btn btn-ghost btn-sm mt10" onclick="openShareReveal('${poolKey}',${allMatches.indexOf(m)})">${icon('share',13)}Share this — start the banter</button>
    </div>`;}).join(''):`<div class="card"><div class="kicker">No matches in this window</div>

      <div class="note" style="margin-top:8px">Not enough picks yet to show a breakdown.</div>
    </div>`;
    const total=rd.groups.reduce((sum,g)=>sum+g.avs.length,0)+rd.noPick.length;
    return`<div class="card mb10">
      <div class="between mb10"><div><b style="font-size:13.5px">${s.q}</b>
        <div style="font-size:11px;color:var(--dim)">${s.points} pts · ${fmtMoney(s.prize,pool.currency)}</div></div>

      ${rd.groups.map(g=>`
        <div class="between" style="margin-bottom:7px">
          <div class="row" style="gap:5px">${g.avs.map(i=>`<img class="av sm" src="${AV(i)}" alt="">`).join('')}</div>
          <span class="chip ${s.type==='single'&&specialOptionLabel(s,g.key)===you?'chip-accent':'chip-muted'}">${specialOptionLabel(s,g.key)}${s.type==='single'?` · ${Math.round(g.avs.length/total*100)}%`:''}</span>
        </div>`).join('')}
      ${rd.noPick.length?`<div class="row" style="gap:7px;margin-top:2px">
        <div class="row" style="gap:5px">${rd.noPick.map(i=>`<img class="av sm" src="${AV(i)}" alt="">`).join('')}</div>
        <span style="font-size:11px;color:var(--dim)">not answered</span></div>`:''}
    </div>`;
  }).join('')}`:''}`;
}
/* The missing link (2026-08-05): prize distribution configures *how* a pot
   splits, but nothing ever closed a period or tracked who actually won it.
   Snapshots leaderboardRows() at close time against the pool's periodSplit/
   seasonSplit + tieRule, grouping consecutive same-points rows as tied.
   'split': tied members share the sum of the ranks they occupy, evenly —
   budget-safe by construction (same total, just divided).
   'shrink' — CORRECTED 2026-08-06: originally gave each tied member the
   TOP tied rank's full %, which multiplies spend by tie-group size and can
   exceed the pot (e.g. two tied for 50%+30% both got 50% = 100% just for
   the tie, before whatever 3rd place added on top). Fixed to give each
   tied member the LOWEST of the ranks they occupy instead — e.g. that same
   pair now gets 30% each (60% total, under the 80% those two slots were
   allocated) — the gap between what the higher ranks would've paid and
   what's actually paid out is what "fewer prizes" means: guaranteed
   budget-safe, since the lowest rank's % is by definition ≤ every other
   rank in the group. */
function computeWinners(pool,periodKey){
  const rows=leaderboardRows(periodKey);
  const split=periodKey==='overall'?pool.seasonSplit:pool.periodSplit;
  const pot=periodKey==='overall'?pool.prizeOverall:pool.prizePerPeriod;

  tabbar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===a));
  /* Was a hardcoded "2" in the static shell HTML — never reflected real
     picks (2026-08-06). Same "pools with something pending" definition
     Profile's own Predictions chip already uses, so the two don't disagree. */
  const openCount=Object.keys(POOLS).filter(k=>(SCHEDULE[POOLS[k].competition]||[]).some(m=>!(state.picks[k]&&state.picks[k][m.id]))).length;
  predictBadge.textContent=openCount;
  predictBadge.style.display=openCount?'flex':'none';
  hydrate(tabbar);
  lastScreen=state.screen;
}

let wtRole=null, wtStep=-1, wtActive=false, wtSteps=[];

/* Trimmed 2026-08-07 (user: "blocking most of the screen and doesn't explain

function wtDevice(){return document.querySelector('.device')}
function wtShouldShow(){try{return!localStorage.getItem(WT_KEY)}catch(e){return true}}
function wtMarkDone(){try{localStorage.setItem(WT_KEY,'1')}catch(e){}}

function wtShowWelcome(){
  const el=document.getElementById('wt-welcome');
  if(el){el.classList.add('show');el.style.display='flex'}
}
function wtHideWelcome(){
  const el=document.getElementById('wt-welcome');
  if(el){el.classList.remove('show');el.style.display='none'}
}
function wtBegin(role){
  wtHideWelcome();
  wtRole=role;
  wtSteps=role==='admin'?WT_ADMIN:WT_MEMBER;
  wtActive=true;
  wtStep=0;
  wtShowStep(0);
}
function wtSkip(){
  wtHideWelcome();
  wtHideAll();
  wtMarkDone();
  wtActive=false;
}
function wtNext(){
  if(!wtActive)return;
  if(wtStep<wtSteps.length-1){wtStep++;wtShowStep(wtStep)}
  else wtFinish();
}
function wtBack(){
  if(!wtActive||wtStep<=0)return;
  wtStep--;
  wtShowStep(wtStep);
}
function wtFinish(){
  wtHideAll();
  wtMarkDone();
  wtActive=false;
  toast(wtRole==='admin'?'Admin tour complete':'Member tour complete');
}
function wtRelaunch(){
  try{localStorage.removeItem(WT_KEY)}catch(e){}
  wtHideAll();
  wtActive=false;
  wtStep=-1;
  wtShowWelcome();
}

function wtShowStep(idx){
  const step=wtSteps[idx];
  if(!step)return;
  if(typeof step.setup==='function')step.setup();
  if(step.screen){state.screen=step.screen}
  render();
  // wait for DOM paint inside device
  requestAnimationFrame(()=>setTimeout(()=>{
    /* Fixed 2026-08-07: the target can sit well below the fold inside
       device-body's own scroll (e.g. Reveal, near the bottom of a long
       Board) — without this, the spotlight hole was drawn thousands of px
       off-screen and the card floated with nothing to point at. */
    const root=wtDevice();
    const el=step.target&&root?(root.querySelector(step.target)||document.querySelector(step.target)):null;
    if(el&&typeof el.scrollIntoView==='function'){
      el.scrollIntoView({block:'center',behavior:'auto'});
    }
    wtRenderCard(step,idx);
    wtRenderSpotlight(step);
    wtRenderProgress(idx);
  },step.screen?90:30));
}

function wtRenderSpotlight(step){
  const svg=document.getElementById('wt-svg');
  const hole=document.getElementById('wt-hole');
  const blocker=document.getElementById('wt-blocker');
  const pulse=document.getElementById('wt-pulse-ring');
  const root=wtDevice();
  if(!svg||!root)return;

  if(!step.target){
    svg.style.display='block';
    // full dim, no hole
    hole.setAttribute('width',0);hole.setAttribute('height',0);
    pulse.style.display='none';
    blocker.style.display='block';
    return;
  }
  const el=root.querySelector(step.target)||document.querySelector(step.target);
  if(!el){
    svg.style.display='block';
    hole.setAttribute('width',0);hole.setAttribute('height',0);
    pulse.style.display='none';
    blocker.style.display='block';
    return;
  }
  const PAD=8;
  const rr=root.getBoundingClientRect();
  const r=el.getBoundingClientRect();
  const x=r.left-rr.left-PAD;
  const y=r.top-rr.top-PAD;
  const w=r.width+PAD*2;
  const h=r.height+PAD*2;
  svg.style.display='block';
  hole.setAttribute('x',x);hole.setAttribute('y',y);
  hole.setAttribute('width',Math.max(0,w));hole.setAttribute('height',Math.max(0,h));
  pulse.style.display='block';
  pulse.style.left=x+'px';pulse.style.top=y+'px';
  pulse.style.width=w+'px';pulse.style.height=h+'px';
  blocker.style.display='block';
}

function wtRenderCard(step,idx){
  const card=document.getElementById('wt-card');
  if(!card)return;
  card.classList.add('show');
  document.getElementById('wt-section').textContent=step.section+(wtRole?` · ${wtRole}`:'');
  document.getElementById('wt-title').textContent=step.title;
  document.getElementById('wt-text').innerHTML=step.text;
  document.getElementById('wt-counter').textContent=`${idx+1} / ${wtSteps.length}`;
  const dd=document.getElementById('wt-deepdive');
  const ddBody=document.getElementById('wt-dd-body');
  const ddToggle=document.getElementById('wt-dd-toggle');
  if(step.deepdive){
    dd.style.display='block';
    ddBody.innerHTML=step.deepdive;
    ddBody.classList.remove('open');
    ddToggle.classList.remove('open');
  }else dd.style.display='none';
  document.getElementById('wt-back-btn').style.display=idx===0?'none':'';
  document.getElementById('wt-next-btn').textContent=idx===wtSteps.length-1?'Finish ✓':'Next →';
  requestAnimationFrame(()=>wtPositionCard(step,card));
}

function wtPositionCard(step,card){
  const root=wtDevice();
  if(!root||!card)return;
  const cw=Math.min(300,root.clientWidth-24);
  card.style.width=cw+'px';
  const ch=card.offsetHeight||170;
  const vw=root.clientWidth, vh=root.clientHeight, M=12;
  let top,left;
  const el=step.target?(root.querySelector(step.target)||document.querySelector(step.target)):null;
  if(!el){
    top=(vh-ch)/2; left=(vw-cw)/2;
  }else{
    const rr=root.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const PAD=8;
    const sx=r.left-rr.left-PAD, sy=r.top-rr.top-PAD;
    const sw=r.width+PAD*2, sh=r.height+PAD*2;
    switch(step.card){
      case 'below': top=sy+sh+M; left=Math.min(Math.max(sx,M),vw-cw-M); break;
      case 'above': top=sy-ch-M; left=Math.min(Math.max(sx,M),vw-cw-M); break;
      case 'right': top=Math.min(Math.max(sy,M),vh-ch-M); left=sx+sw+M; if(left+cw>vw-M)left=sx-cw-M; break;
      case 'left': top=Math.min(Math.max(sy,M),vh-ch-M); left=sx-cw-M; if(left<M)left=sx+sw+M; break;
      default: top=(vh-ch)/2; left=(vw-cw)/2;
    }
    // if card would sit outside phone, clamp / center fallback
    if(top<M||top+ch>vh-M||left<M||left+cw>vw-M){
      // prefer below if space, else above, else center
      if(sy+sh+M+ch<vh-M){top=sy+sh+M;left=Math.min(Math.max((vw-cw)/2,M),vw-cw-M)}
      else if(sy-ch-M>M){top=sy-ch-M;left=Math.min(Math.max((vw-cw)/2,M),vw-cw-M)}
      else{top=Math.max(M,(vh-ch)/2);left=Math.max(M,(vw-cw)/2)}
    }
    top=Math.max(M,Math.min(top,vh-ch-M));
    left=Math.max(M,Math.min(left,vw-cw-M));
  }
  card.style.top=top+'px';
  card.style.left=left+'px';
}

function wtRenderProgress(idx){
  const bar=document.getElementById('wt-progress');
  if(!bar)return;
  bar.innerHTML=wtSteps.map((_,i)=>`<div class="wt-dot ${i<idx?'done':i===idx?'active':''}"></div>`).join('');
}
function wtToggleDeepDive(){
  const body=document.getElementById('wt-dd-body');
  const toggle=document.getElementById('wt-dd-toggle');
  const open=body.classList.toggle('open');
  toggle.classList.toggle('open',open);
  const step=wtSteps[wtStep];
  if(step)setTimeout(()=>wtPositionCard(step,document.getElementById('wt-card')),40);
}
function wtHideAll(){
  const svg=document.getElementById('wt-svg');
  const card=document.getElementById('wt-card');
  const pulse=document.getElementById('wt-pulse-ring');
  const blocker=document.getElementById('wt-blocker');
  if(svg)svg.style.display='none';
  if(card)card.classList.remove('show');
  if(pulse)pulse.style.display='none';
  if(blocker)blocker.style.display='none';
}

// Reposition on resize while active
window.addEventListener('resize',()=>{
  if(!wtActive||wtStep<0)return;
  const step=wtSteps[wtStep];
  if(step){wtRenderSpotlight(step);wtPositionCard(step,document.getElementById('wt-card'))}
});

tabbar.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.go);});
sbTime.textContent=fmtT(Date.now());
chrome();render();
setTimeout(()=>{if(wtShouldShow())wtShowWelcome();},500);
