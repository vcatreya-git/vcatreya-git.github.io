<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/>
  </marker>
</defs>
<style>
  .box   { fill:#EEF2FF; stroke:#4338CA; stroke-width:1.5; }
  .box-g { fill:#ECFDF5; stroke:#047857; stroke-width:1.5; }
  .box-o { fill:#FFF7ED; stroke:#C2410C; stroke-width:1.5; }
  .box-p { fill:#F5F3FF; stroke:#6D28D9; stroke-width:1.5; }
  .box-t { fill:#F0FDFA; stroke:#0D9488; stroke-width:1.5; }
  .title { font:700 18px system-ui,sans-serif; fill:#0F172A; }
  .sub   { font:12px system-ui,sans-serif; fill:#64748B; }
  .grp-l { font:700 11px system-ui,sans-serif; fill:#94A3B8; letter-spacing:.04em; }
  .badge { font:600 10px system-ui,sans-serif; fill:#047857; text-anchor:middle; }
  .lab   { font:600 12px system-ui,sans-serif; fill:#1E293B; text-anchor:middle; }
  .lab2  { font:10px system-ui,sans-serif; fill:#64748B; text-anchor:middle; }
  .edge  { stroke:#CBD5E1; stroke-width:1.5; fill:none; marker-end:url(#a); }
  .legend{ font:11px system-ui,sans-serif; fill:#94A3B8; }
</style>

