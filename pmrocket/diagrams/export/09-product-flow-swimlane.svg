<line x1="264" y1="369" x2="264" y2="387" class="edge"/>
<line x1="504" y1="369" x2="504" y2="387" class="edge"/>
<line x1="744" y1="369" x2="744" y2="387" class="edge"/>
<line x1="984" y1="369" x2="984" y2="387" class="edge"/>
<line x1="1234" y1="369" x2="1234" y2="387" class="edge"/>

