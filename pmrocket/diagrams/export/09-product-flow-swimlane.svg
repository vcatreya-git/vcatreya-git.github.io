<line x1="375" y1="148" x2="393" y2="148" class="edge"/>
<line x1="615" y1="148" x2="633" y2="148" class="edge"/>
<line x1="855" y1="148" x2="873" y2="148" class="edge"/>
<line x1="1095" y1="148" x2="1113" y2="148" class="edge"/>

<!-- Footer -->
<text x="144" y="515" class="sub">PMRocket D9 · User action → Platform response → User outcome · app.diagrams.net</text>
</svg>
