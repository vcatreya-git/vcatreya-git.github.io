<!-- Card: ABOVE -->
<rect x="530" y="64" width="220" height="140" rx="8" fill="#ECFDF5" stroke="#047857" stroke-width="1.5" filter="url(#sh)"/>
<rect x="530" y="64" width="220" height="36" rx="8" fill="#047857"/>
<rect x="530" y="88" width="220" height="12" fill="#047857"/>
<text x="640" y="88" class="stage" style="font-size:12px">Building Evidence (Months 1–2)</text>
<text x="640" y="116" class="body">12 artefacts in progress</text>
<text x="640" y="132" class="body">3 at Mastered · 7 at Practised</text>
<text x="640" y="148" class="body">Readiness score: 22 → 52</text>
<text x="640" y="164" class="body">Case studies, interview notes, docs</text>
<!-- Connector to timeline -->
<line x1="640" y1="198" x2="640" y2="204" stroke="#047857" stroke-width="2"/>

<!-- Emotion tag below -->
<rect x="574" y="246" width="132" height="22" rx="11" fill="#ECFDF5" stroke="#047857" stroke-width="1"/>
<text x="640" y="262" class="tag" style="fill:#047857">Progress I can see ✓</text>

<!-- ─── MILESTONE 4: GAP ANALYSIS ─────────────────────────────────────────── -->
<!-- Node -->
<circle cx="890" cy="220" r="22" fill="#B45309" filter="url(#sh)"/>
<text x="890" y="225" class="stage">4</text>

<!-- Card: BELOW -->
<rect x="780" y="276" width="220" height="140" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5" filter="url(#sh)"/>
<rect x="780" y="276" width="220" height="36" rx="8" fill="#B45309"/>
<rect x="780" y="300" width="220" height="12" fill="#B45309"/>
<text x="890" y="300" class="stage" style="font-size:12px">Gap Analysis vs Real JDs</text>
<text x="890" y="328" class="body">Score: 61 — approaching threshold</text>
<text x="890" y="344" class="body">Top gap: Business metrics (87% of JDs)</text>
<text x="890" y="360" class="body">Top gap: Roadmap trade-offs (72%)</text>
<text x="890" y="376" class="body">System recommends 3 artefacts</text>
<!-- Connector to timeline -->
<line x1="890" y1="236" x2="890" y2="274" stroke="#B45309" stroke-width="2"/>

<!-- Emotion tag above -->
<rect x="824" y="196" width="132" height="22" rx="11" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
<text x="890" y="212" class="tag" style="fill:#92400E">Now I know the gaps</text>

<!-- ─── MILESTONE 5: READY TO APPLY ──────────────────────────────────────── -->
<!-- Node -->
<circle cx="1270" cy="220" r="22" fill="#0E7490" filter="url(#sh)"/>
<text x="1270" y="225" class="stage">5</text>

<!-- Card: ABOVE -->
<rect x="1160" y="64" width="220" height="140" rx="8" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5" filter="url(#sh)"/>
<rect x="1160" y="64" width="220" height="36" rx="8" fill="#0E7490"/>
<rect x="1160" y="88" width="220" height="12" fill="#0E7490"/>
<text x="1270" y="88" class="stage" style="font-size:12px">Readiness Gate Reached</text>
<text x="1270" y="116" class="body">Readiness score: 78 ≥ 75 ✓</text>
<text x="1270" y="132" class="body">Gap ≤ 30% · No critical missing skills</text>
<text x="1270" y="148" class="body">Signal: "You're ready to apply"</text>
<text x="1270" y="164" class="body">Resume drafted from evidence (V3a)</text>
<!-- Connector to timeline -->
<line x1="1270" y1="198" x2="1270" y2="204" stroke="#0E7490" stroke-width="2"/>

<!-- Emotion tag below -->
<rect x="1192" y="246" width="156" height="22" rx="11" fill="#ECFEFF" stroke="#0E7490" stroke-width="1"/>
<text x="1270" y="262" class="tag" style="fill:#0E7490">Honest signal to apply ✓</text>

<!-- ─── TIMELINE ARROWS ────────────────────────────────────────────────────── -->
<line x1="163" y1="220" x2="367" y2="220" class="edge"/>
<line x1="413" y1="220" x2="617" y2="220" class="edge"/>
<line x1="663" y1="220" x2="867" y2="220" class="edge"/>
