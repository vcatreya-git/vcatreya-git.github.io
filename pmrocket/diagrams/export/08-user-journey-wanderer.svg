<text x="390" y="328" class="body">3-layer curriculum unlocked</text>
<text x="390" y="344" class="body">Universal + Technical PM + Dev Tools</text>
<text x="390" y="360" class="body">Picks first artefact: Customer Interviews</text>
<text x="390" y="376" class="body">15 sub-topics + 5 search keywords</text>
