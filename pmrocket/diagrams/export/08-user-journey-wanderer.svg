<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L9,4 L0,8 Z" fill="#94A3B8"/>
  </marker>
  <filter id="sh">
    <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000018"/>
  </filter>
</defs>
<style>
  .title  { font:700 20px system-ui,sans-serif; fill:#0F172A; }
  .sub    { font:12px system-ui,sans-serif; fill:#64748B; }
  .stage  { font:700 13px system-ui,sans-serif; fill:#FFFFFF; text-anchor:middle; }
  .time   { font:700 10px system-ui,sans-serif; fill:#94A3B8; text-anchor:middle; letter-spacing:0.5px; }
  .head   { font:700 12px system-ui,sans-serif; fill:#1E293B; text-anchor:middle; }
  .body   { font:11px system-ui,sans-serif; fill:#475569; text-anchor:middle; }
  .tag    { font:700 10px system-ui,sans-serif; text-anchor:middle; }
  .edge   { stroke:#CBD5E1; stroke-width:2; fill:none; marker-end:url(#arr); }
  .tline  { stroke:#E2E8F0; stroke-width:3; fill:none; }
</style>

<!-- Background -->
<rect width="1400" height="460" fill="#FFFFFF"/>

<!-- Title -->
<text x="40" y="38" class="title">The Wanderer's Journey — From Confused to Ready to Apply</text>
<text x="40" y="58" class="sub">Primary persona: aspiring PM, 3–6 months of self-directed prep · No prior PM experience · North America · Developer tools</text>

<!-- ─── TIMELINE BACKBONE ──────────────────────────────────────────────────── -->
<line x1="80" y1="220" x2="1360" y2="220" class="tline"/>

<!-- Timeline segment labels -->
<text x="230" y="216" class="time" style="fill:#CBD5E1">Day 1</text>
<text x="480" y="216" class="time" style="fill:#CBD5E1">Week 2</text>
<text x="730" y="216" class="time" style="fill:#CBD5E1">Month 2</text>
<text x="980" y="216" class="time" style="fill:#CBD5E1">Month 4</text>
<text x="1270" y="216" class="time" style="fill:#CBD5E1">Month 6</text>

<!-- ─── MILESTONE 1: SIGN UP + MATCH ─────────────────────────────────────── -->
<!-- Node -->
<circle cx="140" cy="220" r="22" fill="#4338CA" filter="url(#sh)"/>
<text x="140" y="225" class="stage">1</text>

<!-- Card: ABOVE -->
<rect x="30" y="64" width="220" height="140" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="1.5" filter="url(#sh)"/>
<rect x="30" y="64" width="220" height="36" rx="8" fill="#4338CA"/>
<rect x="30" y="88" width="220" height="12" fill="#4338CA"/>
<text x="140" y="88" class="stage" style="font-size:12px">Sign Up + Archetype Match</text>
<text x="140" y="116" class="body">15 questions · 3 minutes</text>
<text x="140" y="132" class="body">Background, goals, geography</text>
<text x="140" y="148" class="body">Gets: Technical PM · 78% confidence</text>
<text x="140" y="164" class="body">Sees primary + runner-up + reasoning</text>
<!-- Connector to timeline -->
<line x1="140" y1="198" x2="140" y2="204" stroke="#4338CA" stroke-width="2"/>

<!-- Emotion tag below -->
<rect x="80" y="246" width="120" height="22" rx="11" fill="#EEF2FF" stroke="#4338CA" stroke-width="1"/>
<text x="140" y="262" class="tag" style="fill:#4338CA">Finally — a direction ✓</text>

<!-- ─── MILESTONE 2: FIRST ROADMAP ────────────────────────────────────────── -->
<!-- Node -->
<circle cx="390" cy="220" r="22" fill="#6D28D9" filter="url(#sh)"/>
